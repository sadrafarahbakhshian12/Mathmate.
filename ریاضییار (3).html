  return `<div class="svgbox"><svg viewBox="0 0 320 250" role="img" aria-label="نمودار سهمی y = x² − 4x + 3">
  <line x1="30" y1="176" x2="305" y2="176" stroke="currentColor"/><line x1="75" y1="14" x2="75" y2="236" stroke="currentColor"/>
  <line x1="${X(2)}" y1="14" x2="${X(2)}" y2="236" stroke="currentColor" stroke-dasharray="4 4" opacity=".45"/>
  ${ticks}
  <polyline points="${pts.join(' ')}" fill="none" stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>
  <circle cx="${X(2)}" cy="${Y(-1)}" r="5" fill="#EC4899"/><circle cx="${X(1)}" cy="176" r="4.5" fill="#0E9F6E"/><circle cx="${X(3)}" cy="176" r="4.5" fill="#0E9F6E"/><circle cx="75" cy="${Y(3)}" r="4.5" fill="#F59E0B"/>
  <text x="${X(2)+8}" y="${Y(-1)+16}">(2, −1)</text><text x="${X(1)-30}" y="166">(1, 0)</text><text x="${X(3)+6}" y="166">(3, 0)</text><text x="82" y="${Y(3)+4}">(0, 3)</text>
  <text x="${X(2)+6}" y="28">x = 2</text><text x="296" y="190">x</text><text x="80" y="22">y</text></svg></div>`;
}
const circleSvg=`<div class="svgbox"><svg viewBox="0 0 260 260" role="img" aria-label="دایره‌ی مثلثاتی و زاویه‌ی ۶۰ درجه">
  <line x1="12" y1="130" x2="248" y2="130" stroke="currentColor"/><line x1="130" y1="12" x2="130" y2="248" stroke="currentColor"/>
  <circle cx="130" cy="130" r="100" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="130" y1="130" x2="180" y2="43.4" stroke="#F59E0B" stroke-width="3"/>
  <line x1="180" y1="43.4" x2="180" y2="130" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="5 4"/>
  <line x1="130" y1="43.4" x2="180" y2="43.4" stroke="currentColor" stroke-dasharray="3 4" opacity=".5"/>
  <path d="M160 130 A30 30 0 0 0 145 104" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="180" cy="43.4" r="5" fill="#F59E0B"/>
  <text x="163" y="122">θ</text><text x="186" y="92">sin θ</text><text x="140" y="146">cos θ</text>
  <text x="150" y="36">(cos θ , sin θ)</text><text x="238" y="124">x</text><text x="135" y="22">y</text><text x="232" y="146">1</text></svg></div>`;

/* ---------- محتوای درس‌ها ---------- */
const CATS=[
{id:'arith',t:'حساب و اعداد',d:'اعداد، کسرها، درصد، توان و ریشه؛ پایه‌ی همه‌ی ریاضیات.',c:'#3B82F6',g:'÷',lessons:[
{id:'arith-1',t:'دسته‌بندی اعداد',s:'از اعداد طبیعی تا اعداد حقیقی',h:`
<p>اعداد را بر اساس ویژگی‌هایشان در خانواده‌هایی دسته‌بندی می‌کنیم. هر خانواده درون خانواده‌ی بزرگ‌تری جا می‌گیرد.</p>
${tb(['نام','نماد','توضیح','نمونه'],[
['طبیعی',m('ℕ'),'اعداد شمارش',m('1, 2, 3, …')],
['حسابی','—','اعداد طبیعی همراه با صفر',m('0, 1, 2, 3, …')],
['صحیح',m('ℤ'),'طبیعی‌ها، صفر و قرینه‌ی طبیعی‌ها',m('…, −2, −1, 0, 1, 2, …')],
['گویا',m('ℚ'),'عددی که بتوان آن را به‌صورت '+m(F('p','q'))+' نوشت ('+m('q ≠ 0')+' و '+m('p, q')+' صحیح)',m(F('3','4')+', −5, 0.25')],
['گنگ','—','عدد حقیقی که گویا نباشد؛ نمایش اعشاری آن نه پایان‌پذیر است و نه تکرارشونده',m(S('2')+', π')],
['حقیقی',m('ℝ'),'اجتماع گویاها و گنگ‌ها؛ همه‌ی نقطه‌های محور اعداد','همه‌ی موارد بالا']])}
${B('ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ')}
${tip('هر عدد اعشاری پایان‌پذیر یا متناوب گویاست. مثلاً '+m('0.333… = '+F('1','3'))+'. ریشه‌ی دوم عددی که مربع کامل نیست (مانند '+m(S('2'))+' و '+m(S('5'))+') گنگ است.')}
${eg('<p>'+m('0.25 = '+F('1','4'))+' گویاست. '+m(S('9')+' = 3')+' هم گویاست. اما '+m(S('2')+' ≈ 1.41421…')+' هیچ‌گاه تکرار نمی‌شود و گنگ است.</p>')}
${pr('آیا عدد '+m('0.75')+' گویاست؟','بله. '+m('0.75 = '+F('3','4'))+' و می‌توان آن را به‌صورت کسر نوشت.')}`},

{id:'arith-2',t:'بخش‌پذیری و اعداد اول',s:'تشخیص مقسوم‌علیه‌ها و تجزیه به عامل‌های اول',h:`
<p>گفته می‌شود عدد <b>a</b> بر <b>b</b> بخش‌پذیر است، اگر باقیمانده‌ی تقسیم a بر b صفر باشد. قاعده‌های زیر کمک می‌کنند بدون تقسیم، بخش‌پذیری را تشخیص دهیم.</p>
${tb(['بر','شرط بخش‌پذیری'],[
['2','رقم یکان زوج باشد'],['3','مجموع ارقام بر 3 بخش‌پذیر باشد'],['4','عدد دو رقم آخر بر 4 بخش‌پذیر باشد'],['5','رقم یکان 0 یا 5 باشد'],['6','هم بر 2 و هم بر 3 بخش‌پذیر باشد'],['9','مجموع ارقام بر 9 بخش‌پذیر باشد'],['10','رقم یکان 0 باشد'],['11','تفاضل مجموع ارقام جایگاه‌های فرد و زوج، صفر یا مضرب 11 باشد']])}
${key('عدد اول','<p>عدد طبیعی بزرگ‌تر از 1 که فقط دو مقسوم‌علیه دارد: 1 و خودش. اعداد اول: '+m('2, 3, 5, 7, 11, 13, 17, 19, …')+' عدد 2 تنها عدد اول زوج است و عدد 1 اول نیست.</p><p>هر عدد طبیعی بزرگ‌تر از 1 را می‌توان به‌صورت یکتا (جدا از ترتیب) حاصل‌ضرب عامل‌های اول نوشت.</p>')}
${tip('برای تشخیص اول بودن عدد n کافی است بخش‌پذیری آن را بر اعداد اولی که از '+m(S('n'))+' بیشتر نیستند بررسی کنید.')}
${eg('<p>تجزیه‌ی 84: '+m('84 = 2 × 42 = 2 × 2 × 21 = 2<sup>2</sup> × 3 × 7')+'</p><p>عدد 123456: مجموع ارقام 21 است. چون 21 بر 3 بخش‌پذیر است و بر 9 نه، عدد بر 3 بخش‌پذیر است ولی بر 9 نه.</p><p>عدد 1001: '+m('(1 + 0) − (0 + 1) = 0')+' پس بر 11 بخش‌پذیر است. در واقع '+m('1001 = 7 × 11 × 13')+'.</p>')}
${pr('آیا 91 عدد اول است؟','خیر. '+m(S('91')+' ≈ 9.5')+' و اعداد اول 2، 3، 5 و 7 را آزمایش می‌کنیم. 91 بر 7 بخش‌پذیر است: '+m('91 = 7 × 13')+'.')}`},

{id:'arith-3',t:'ب.م.م و ک.م.م',s:'بزرگ‌ترین مقسوم‌علیه و کوچک‌ترین مضرب مشترک',h:`
<p><b>ب.م.م</b> (بزرگ‌ترین مقسوم‌علیه مشترک) بزرگ‌ترین عددی است که هر دو عدد را می‌شمارد. <b>ک.م.م</b> (کوچک‌ترین مضرب مشترک) کوچک‌ترین عدد مثبتی است که مضرب هر دو عدد باشد.</p>
<h3>روش تجزیه</h3>
<ul><li>ب.م.م: عامل‌های اول مشترک، با <b>کمترین</b> توان.</li><li>ک.م.م: همه‌ی عامل‌های اول، با <b>بیشترین</b> توان.</li></ul>
${B(R('حاصل‌ضرب ب.م.م و ک.م.م برابر حاصل‌ضرب دو عدد است:','gcd(a, b) × lcm(a, b) = a × b'))}
<h3>الگوریتم اقلیدس</h3>
<p>با تقسیم‌های متوالی، تا رسیدن به باقیمانده‌ی صفر؛ آخرین باقیمانده‌ی غیرصفر، ب.م.م است.</p>
${B('gcd(a, b) = gcd(b, a mod b)')}
${eg('<p>برای 12 و 18: '+m('12 = 2<sup>2</sup> × 3')+' و '+m('18 = 2 × 3<sup>2</sup>')+'. ب.م.م = '+m('2 × 3 = 6')+' و ک.م.م = '+m('2<sup>2</sup> × 3<sup>2</sup> = 36')+'. بررسی: '+m('6 × 36 = 216 = 12 × 18')+'.</p><p>اقلیدس برای 48 و 18: '+m('48 = 2×18 + 12')+'، '+m('18 = 1×12 + 6')+'، '+m('12 = 2×6 + 0')+'. پس ب.م.م برابر 6 است.</p><p>کاربرد: دو اتوبوس که هر 12 و هر 18 دقیقه حرکت می‌کنند، بعد از ک.م.م = 36 دقیقه دوباره با هم حرکت می‌کنند.</p>')}
<div class="widget" data-w="gcd"></div>
${pr('ب.م.م و ک.م.م اعداد 84 و 36 را پیدا کنید.',m('84 = 2<sup>2</sup>×3×7')+' و '+m('36 = 2<sup>2</sup>×3<sup>2</sup>')+'. ب.م.م = '+m('2<sup>2</sup>×3 = 12')+'، ک.م.م = '+m('2<sup>2</sup>×3<sup>2</sup>×7 = 252')+'. (بررسی: '+m('12 × 252 = 3024 = 84 × 36')+')')}`},

{id:'arith-4',t:'کسرها',s:'جمع، ضرب، تقسیم و مقایسه‌ی کسرها',h:`
<p>کسر ${m(F('a','b'))} یعنی چیزی به b بخش برابر تقسیم شده و a بخش از آن در نظر گرفته شده است. مخرج هرگز صفر نیست.</p>
${key('قاعده‌های چهار عمل',B(F('a','b')+' + '+F('c','d')+' = '+F('ad + bc','bd'),F('a','b')+' × '+F('c','d')+' = '+F('ac','bd'),F('a','b')+' ÷ '+F('c','d')+' = '+F('a','b')+' × '+F('d','c')+' = '+F('ad','bc')+'     (c ≠ 0)'))}
<h3>ساده کردن و مقایسه</h3>
<p>برای ساده کردن، صورت و مخرج را بر ب.م.م آن‌ها تقسیم کنید. برای مقایسه‌ی دو کسر مثبت ${m(F('a','b'))} و ${m(F('c','d'))} متقاطع ضرب کنید: اگر ${m('ad > bc')} باشد، کسر اول بزرگ‌تر است.</p>
<p>عدد مخلوط: ${m('2'+F('1','3')+' = '+F('2×3 + 1','3')+' = '+F('7','3'))}</p>
${tip('جمع کسرها یعنی هم‌مخرج کردن، نه جمع صورت‌ها و مخرج‌ها. '+m(F('1','2')+' + '+F('1','3')+' ≠ '+F('2','5'))+' ولی درست آن '+m(F('5','6'))+' است.')}
${eg('<p>'+m(F('1','2')+' + '+F('1','3')+' = '+F('3','6')+' + '+F('2','6')+' = '+F('5','6'))+'</p><p>'+m(F('2','3')+' ÷ '+F('4','5')+' = '+F('2','3')+' × '+F('5','4')+' = '+F('10','12')+' = '+F('5','6'))+'</p><p>مقایسه‌ی '+m(F('3','4'))+' و '+m(F('5','7'))+': '+m('3 × 7 = 21')+' و '+m('5 × 4 = 20')+'، پس '+m(F('3','4')+' > '+F('5','7'))+'.</p><p>تبدیل به اعشار: '+m(F('3','8')+' = 3 ÷ 8 = 0.375')+'</p>')}
${pr(m(F('3','4')+' − '+F('1','6'))+' را حساب کنید.',m(F('9','12')+' − '+F('2','12')+' = '+F('7','12')))}`},

{id:'arith-5',t:'نسبت، تناسب و درصد',s:'تناسب مستقیم و معکوس، تخفیف و افزایش',h:`
<h3>درصد</h3>
<p>x درصد از y برابر ${m(F('x','100')+' × y')} است. اگر مقداری p درصد زیاد شود، در ${m('1 + '+F('p','100'))} ضرب می‌شود و اگر p درصد کم شود، در ${m('1 − '+F('p','100'))} ضرب می‌شود.</p>
<h3>نسبت و تناسب</h3>
${key('تناسب',`<p>اگر ${m(F('a','b')+' = '+F('c','d'))} باشد، آن‌گاه ${m('ad = bc')} (ضرب طرفین در وسطین).</p><ul><li><b>تناسب مستقیم:</b> با زیاد شدن یک کمیت، دیگری هم به همان نسبت زیاد می‌شود؛ ${m(F('y','x'))} ثابت است.</li><li><b>تناسب معکوس:</b> با زیاد شدن یک کمیت، دیگری به همان نسبت کم می‌شود؛ ${m('x × y')} ثابت است.</li></ul>`)}
${eg('<p><b>تخفیف:</b> قیمت 800٬000 تومان با 15٪ تخفیف: '+m('800000 × 0.85 = 680000')+' تومان.</p><p><b>تغییر پی‌درپی:</b> 20٪ افزایش و بعد 20٪ کاهش: '+m('1.2 × 0.8 = 0.96')+'، یعنی در نهایت 4٪ کم شده است، نه این‌که قیمت به حالت اول برگردد.</p><p><b>مستقیم:</b> 3 کیلوگرم میوه 240٬000 تومان است. هر کیلو '+m('240000 ÷ 3 = 80000')+' تومان و 5 کیلو '+m('5 × 80000 = 400000')+' تومان.</p><p><b>معکوس:</b> 4 کارگر کاری را در 12 روز انجام می‌دهند. حجم کار '+m('4 × 12 = 48')+' کارگر-روز است. با 6 کارگر: '+m('48 ÷ 6 = 8')+' روز.</p>')}
${pr('25٪ از 360 چقدر است؟',m(F('25','100')+' × 360 = 90'))}`},

{id:'arith-6',t:'توان، ریشه و نماد علمی',s:'قاعده‌های توان و ریشه‌گیری',h:`
<p>توان یعنی ضرب مکرر: ${m('a<sup>n</sup> = a × a × … × a')} (n بار). قاعده‌های زیر برای ${m('a ≠ 0')} برقرارند.</p>
${key('قاعده‌های توان',B('a<sup>m</sup> × a<sup>n</sup> = a<sup>m+n</sup>','a<sup>m</sup> ÷ a<sup>n</sup> = a<sup>m−n</sup>','(a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup>','(ab)<sup>n</sup> = a<sup>n</sup> b<sup>n</sup>','a<sup>0</sup> = 1','a<sup>−n</sup> = '+F('1','a<sup>n</sup>'),'a<sup>1/n</sup> = <sup>n</sup>√a'))}
<p>برای ریشه‌ی دوم: ${m(S('ab')+' = '+S('a')+' × '+S('b'))} (وقتی ${m('a, b ≥ 0')}) و ${m(S('a<sup>2</sup>')+' = |a|')}.</p>
<h3>نماد علمی</h3>
<p>هر عدد را به‌شکل ${m('a × 10<sup>n</sup>')} می‌نویسیم که ${m('1 ≤ a < 10')} و n صحیح است.</p>
${eg('<p>'+m('2<sup>3</sup> × 2<sup>4</sup> = 2<sup>7</sup> = 128')+'</p><p>'+m(S('50')+' = '+S('25 × 2')+' = 5'+S('2'))+'</p><p>گویا کردن مخرج: '+m(F('1',S('2'))+' = '+F(S('2'),'2'))+'</p><p>'+m('4500 = 4.5 × 10<sup>3</sup>')+' و '+m('0.00032 = 3.2 × 10<sup>−4</sup>')+'</p>')}
${tip('توان روی جمع پخش نمی‌شود: '+m('(3 + 4)<sup>2</sup> = 49')+' ولی '+m('3<sup>2</sup> + 4<sup>2</sup> = 25')+'.')}
${pr(m('2<sup>−3</sup>')+' چند است؟',m('2<sup>−3</sup> = '+F('1','2<sup>3</sup>')+' = '+F('1','8')))}`}
]},

{id:'algebra',t:'جبر',d:'عبارت‌ها، معادله‌ها، نامعادله‌ها، دنباله‌ها و لگاریتم.',c:'#8B5CF6',g:'x',lessons:[
{id:'algebra-1',t:'عبارت‌های جبری و اتحادها',s:'اتحادهای مهم و فاکتورگیری',h:`
<p>عبارت جبری ترکیبی از عدد و متغیر است. جمله‌های متشابه (با بخش متغیر یکسان) جمع می‌شوند: ${m('3x + 5x = 8x')}. خاصیت پخشی: ${m('a(b + c) = ab + ac')}.</p>
${key('اتحادهای مهم',B('(a + b)<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup>','(a − b)<sup>2</sup> = a<sup>2</sup> − 2ab + b<sup>2</sup>','a<sup>2</sup> − b<sup>2</sup> = (a − b)(a + b)','(x + a)(x + b) = x<sup>2</sup> + (a + b)x + ab','(a + b)<sup>3</sup> = a<sup>3</sup> + 3a<sup>2</sup>b + 3ab<sup>2</sup> + b<sup>3</sup>','a<sup>3</sup> + b<sup>3</sup> = (a + b)(a<sup>2</sup> − ab + b<sup>2</sup>)','a<sup>3</sup> − b<sup>3</sup> = (a − b)(a<sup>2</sup> + ab + b<sup>2</sup>)'))}
<h3>فاکتورگیری</h3>
<p>فاکتورگیری یعنی نوشتن عبارت به‌صورت حاصل‌ضرب. اول عامل مشترک را بیرون می‌کشیم، بعد از اتحادها کمک می‌گیریم.</p>
${eg('<p>'+m('6x<sup>2</sup> + 9x = 3x(2x + 3)')+'</p><p>'+m('x<sup>2</sup> − 9 = (x − 3)(x + 3)')+'</p><p>'+m('x<sup>2</sup> + 5x + 6 = (x + 2)(x + 3)')+' (دو عدد که حاصل‌ضربشان 6 و حاصل‌جمعشان 5 است: 2 و 3)</p><p>محاسبه‌ی ذهنی: '+m('99<sup>2</sup> = (100 − 1)<sup>2</sup> = 10000 − 200 + 1 = 9801')+' و '+m('51 × 49 = (50 + 1)(50 − 1) = 2500 − 1 = 2499')+'.</p>')}
${pr(m('101<sup>2</sup>')+' را با اتحاد حساب کنید.',m('(100 + 1)<sup>2</sup> = 10000 + 200 + 1 = 10201'))}`},

{id:'algebra-2',t:'معادله‌ی درجه اول',s:'حل معادله‌ی خطی و مسئله‌های کلامی',h:`
<p>معادله‌ی درجه اول (خطی) با یک مجهول به‌شکل ${m('ax + b = 0')} است. هر کاری که روی یک طرف انجام می‌دهیم، باید روی طرف دیگر هم انجام شود.</p>
${key('جواب',B('ax + b = 0  ⇒  x = '+F('−b','a')+'     (a ≠ 0)'))}
<h3>گام‌های حل</h3>
<ol><li>پرانتزها را باز کنید و در صورت وجود کسر، طرفین را در مخرج مشترک ضرب کنید تا کسرها حذف شوند.</li><li>جمله‌های مجهول را یک طرف و عددها را طرف دیگر ببرید (با عوض شدن علامت).</li><li>طرفین را بر ضریب مجهول تقسیم کنید و جواب را در معادله‌ی اول بیازمایید.</li></ol>
${eg('<p>'+m('3x + 7 = 22 ⇒ 3x = 15 ⇒ x = 5')+'</p><p>'+m('5x + 2 = 3x + 10 ⇒ 2x = 8 ⇒ x = 4')+'</p><p>'+m(F('x','2')+' + 1 = 4 ⇒ '+F('x','2')+' = 3 ⇒ x = 6')+'</p><p><b>مسئله:</b> مجموع سه عدد متوالی 72 است. عددها را '+m('x, x + 1, x + 2')+' می‌گیریم: '+m('3x + 3 = 72 ⇒ x = 23')+'. عددها 23، 24 و 25 هستند و مجموعشان 72 است.</p>')}
${pr(m('2(x − 3) = 10')+' را حل کنید.',m('x − 3 = 5 ⇒ x = 8'))}`},

{id:'algebra-3',t:'معادله‌ی درجه دوم',s:'مبین، فرمول ریشه‌ها و روابط ریشه‌ها',h:`
<p>معادله‌ی درجه دوم به‌شکل ${m('ax<sup>2</sup> + bx + c = 0')} با ${m('a ≠ 0')} است. مقدار ${m('Δ = b<sup>2</sup> − 4ac')} که «مبین» نام دارد، تعداد ریشه‌های حقیقی را تعیین می‌کند.</p>
${key('فرمول ریشه‌ها',B('Δ = b<sup>2</sup> − 4ac','x = '+F('−b ± '+S('Δ'),'2a')))}
${tb(['مبین','نتیجه'],[[m('Δ > 0'),'دو ریشه‌ی حقیقی متمایز'],[m('Δ = 0'),'یک ریشه‌ی مضاعف: '+m('x = '+F('−b','2a'))],[m('Δ < 0'),'ریشه‌ی حقیقی ندارد']])}
<h3>رابطه‌ی ریشه‌ها و ضریب‌ها</h3>
<p>اگر ${m('x<sub>1</sub>')} و ${m('x<sub>2</sub>')} ریشه‌ها باشند:</p>
${B('x<sub>1</sub> + x<sub>2</sub> = '+F('−b','a'),'x<sub>1</sub> · x<sub>2</sub> = '+F('c','a'))}
${eg('<p>'+m('x<sup>2</sup> − 5x + 6 = 0')+': '+m('Δ = 25 − 24 = 1')+' و '+m('x = '+F('5 ± 1','2'))+' پس '+m('x = 3')+' یا '+m('x = 2')+'. بررسی: مجموع 5 و حاصل‌ضرب 6 است.</p><p>'+m('x<sup>2</sup> + 2x + 5 = 0')+': '+m('Δ = 4 − 20 = −16 < 0')+' پس ریشه‌ی حقیقی ندارد.</p>')}
<div class="widget" data-w="quad"></div>
${pr(m('2x<sup>2</sup> − 8 = 0')+' را حل کنید.',m('x<sup>2</sup> = 4')+' پس '+m('x = ±2')+'. (نیازی به فرمول نیست.)')}`},

{id:'algebra-4',t:'دستگاه معادله‌ها',s:'روش جانشینی و حذفی',h:`
<p>دستگاه دو معادله‌ی دو مجهولی، یعنی دو شرط هم‌زمان روی x و y. هر جواب باید در هر دو معادله صدق کند.</p>
<h3>روش حذفی</h3>
<p>معادله‌ها را طوری در عدد ضرب می‌کنیم که ضریب یکی از مجهول‌ها قرینه شود، سپس معادله‌ها را جمع می‌کنیم.</p>
<h3>روش جانشینی</h3>
<p>یک مجهول را از یک معادله بر حسب دیگری می‌نویسیم و در معادله‌ی دوم قرار می‌دهیم.</p>
${eg('<p>'+m('x + y = 10')+' و '+m('x − y = 4')+': با جمع کردن '+m('2x = 14')+' پس '+m('x = 7')+' و '+m('y = 3')+'.</p><p>'+m('2x + 3y = 12')+' و '+m('x − y = 1')+': از معادله‌ی دوم '+m('x = y + 1')+'. جانشینی: '+m('2(y + 1) + 3y = 12 ⇒ 5y = 10 ⇒ y = 2')+' و '+m('x = 3')+'. بررسی: '+m('2×3 + 3×2 = 12')+'.</p>')}
${tip('هر معادله‌ی خطی یک خط است. اگر خط‌ها یکدیگر را در یک نقطه قطع کنند، دستگاه یک جواب دارد. اگر موازی باشند، جواب ندارد و اگر بر هم منطبق باشند، بی‌شمار جواب دارد.')}
${pr('دستگاه '+m('x + 2y = 8')+' و '+m('3x − 2y = 0')+' را حل کنید.','جمع دو معادله: '+m('4x = 8 ⇒ x = 2')+'. سپس '+m('2 + 2y = 8 ⇒ y = 3')+'. بررسی معادله‌ی دوم: '+m('6 − 6 = 0')+'.')}`},

{id:'algebra-5',t:'نامعادله‌ها',s:'نامعادله‌ی خطی، درجه دوم و قدر مطلق',h:`
<p>نامعادله مانند معادله است، اما به‌جای «=» از نمادهای ${m('< , > , ≤ , ≥')} استفاده می‌کند و جواب آن معمولاً یک بازه است.</p>
${key('قاعده‌ی مهم',`<ul><li>جمع یا تفریق یک عدد از دو طرف، جهت نامساوی را تغییر نمی‌دهد.</li><li>ضرب یا تقسیم دو طرف بر عدد <b>مثبت</b>، جهت را حفظ می‌کند.</li><li>ضرب یا تقسیم دو طرف بر عدد <b>منفی</b>، جهت را <b>برعکس</b> می‌کند.</li></ul>`)}
<h3>قدر مطلق</h3>
${B('|x| < a  ⇔  −a < x < a','|x| > a  ⇔  (x < −a  ∨  x > a)')}<p>در هر دو رابطه ${m('a > 0')} است.</p>
${eg('<p>'+m('−2x + 3 > 7 ⇒ −2x > 4 ⇒ x < −2')+' (جهت برعکس شد).</p><p>درجه دوم: '+m('x<sup>2</sup> − 4x + 3 < 0 ⇒ (x − 1)(x − 3) < 0')+'. سهمی رو به بالاست و بین دو ریشه منفی است، پس '+m('1 < x < 3')+'.</p><p>'+m('|x − 2| < 3 ⇒ −3 < x − 2 < 3 ⇒ −1 < x < 5')+'.</p>')}
${pr(m('3x − 5 ≤ 10')+' را حل کنید.',m('3x ≤ 15 ⇒ x ≤ 5')+'، یعنی بازه‌ی '+m('(−∞, 5]')+'.')}`},

{id:'algebra-6',t:'دنباله‌ها',s:'دنباله‌ی حسابی و هندسی',h:`
<p>دنباله فهرستی مرتب از عددهاست. دو نوع مهم آن را می‌شناسیم.</p>
<h3>دنباله‌ی حسابی (اختلاف ثابت d)</h3>
${B('a<sub>n</sub> = a<sub>1</sub> + (n − 1)d','S<sub>n</sub> = '+F('n','2')+'(a<sub>1</sub> + a<sub>n</sub>) = '+F('n','2')+'(2a<sub>1</sub> + (n − 1)d)')}
<h3>دنباله‌ی هندسی (نسبت ثابت r)</h3>
${B('a<sub>n</sub> = a<sub>1</sub> · r<sup>n−1</sup>','S<sub>n</sub> = a<sub>1</sub> · '+F('r<sup>n</sup> − 1','r − 1')+'     (r ≠ 1)','S<sub>∞</sub> = '+F('a<sub>1</sub>','1 − r')+'     (|r| < 1)')}
${eg('<p>دنباله‌ی '+m('3, 7, 11, …')+': '+m('a<sub>1</sub> = 3')+' و '+m('d = 4')+'. جمله‌ی دهم '+m('3 + 9×4 = 39')+' و مجموع ده جمله '+m(F('10','2')+'(3 + 39) = 210')+'.</p><p>دنباله‌ی '+m('2, 6, 18, …')+': '+m('r = 3')+'. جمله‌ی پنجم '+m('2 × 3<sup>4</sup> = 162')+' و مجموع چهار جمله '+m('2 · '+F('3<sup>4</sup> − 1','3 − 1')+' = 80')+' (بررسی: '+m('2 + 6 + 18 + 54 = 80')+').</p><p>'+m('1 + '+F('1','2')+' + '+F('1','4')+' + … = '+F('1','1 − '+F('1','2'))+' = 2')+'</p>')}
${pr('مجموع اعداد 1 تا 100 چقدر است؟','دنباله‌ی حسابی با '+m('a<sub>1</sub> = 1')+' و '+m('a<sub>100</sub> = 100')+': '+m(F('100','2')+'(1 + 100) = 5050')+'.')}`},

{id:'algebra-7',t:'نمایی و لگاریتم',s:'تعریف لگاریتم و قاعده‌های آن',h:`
<p>لگاریتم، عکس عمل توان است. ${m('log<sub>a</sub> x')} یعنی «a را به چه توانی برسانیم تا x شود؟».</p>
${key('تعریف',B('log<sub>a</sub> x = y  ⇔  a<sup>y</sup> = x','(a > 0 ,  a ≠ 1 ,  x > 0)'))}
${key('قاعده‌ها',B('log<sub>a</sub> (xy) = log<sub>a</sub> x + log<sub>a</sub> y','log<sub>a</sub> ('+F('x','y')+') = log<sub>a</sub> x − log<sub>a</sub> y','log<sub>a</sub> (x<sup>n</sup>) = n · log<sub>a</sub> x','log<sub>a</sub> a = 1 ,   log<sub>a</sub> 1 = 0',R('تغییر مبنا:','log<sub>a</sub> b = '+F('ln b','ln a'))))}
${eg('<p>'+m('log<sub>2</sub> 8 = 3')+' چون '+m('2<sup>3</sup> = 8')+'. همچنین '+m('log<sub>10</sub> 1000 = 3')+'.</p><p>'+m('log<sub>2</sub> 4 + log<sub>2</sub> 8 = 2 + 3 = 5 = log<sub>2</sub> 32')+'.</p><p>معادله‌ی '+m('2<sup>x</sup> = 32')+' جواب '+m('x = 5')+' دارد. برای '+m('2<sup>x</sup> = 7')+' لگاریتم می‌گیریم: '+m('x = log<sub>2</sub> 7 = '+F('ln 7','ln 2')+' ≈ 2.807')+'.</p>')}
${pr(m('log<sub>3</sub> 81')+' چند است؟',m('3<sup>4</sup> = 81')+' پس جواب 4 است.')}`}
]},

{id:'geometry',t:'هندسه',d:'مثلث، چهارضلعی، دایره، تشابه و حجم جسم‌ها.',c:'#10B981',g:'△',lessons:[
{id:'geometry-1',t:'مثلث',s:'زاویه‌ها، مساحت و فرمول هرون',h:`
<p>مثلث سه ضلع و سه زاویه دارد. مجموع زاویه‌های داخلی هر مثلث ${m('180°')} است و هر زاویه‌ی خارجی برابر مجموع دو زاویه‌ی داخلی غیرمجاور با آن است.</p>
<p>شرط وجود مثلث: هر ضلع از مجموع دو ضلع دیگر کوچک‌تر و از تفاضل آن‌ها بزرگ‌تر است.</p>
${tb(['نوع','ویژگی'],[['متساوی‌الاضلاع','سه ضلع و سه زاویه (هر کدام 60°) برابر'],['متساوی‌الساقین','دو ضلع و دو زاویه‌ی روبه‌رو برابر'],['قائم‌الزاویه','یک زاویه‌ی 90°'],['مختلف‌الاضلاع','هیچ ضلعی برابر نیست']])}
${key('مساحت',B(R('مساحت مثلث:','S = '+F('1','2')+' × a × h'),R('فرمول هرون:','p = '+F('a + b + c','2')+' ,   S = '+S('p(p − a)(p − b)(p − c)')))+'<p>در این‌جا a یک ضلع و h ارتفاع وارد بر آن ضلع است.</p>')}
${eg('<p>مثلث با ضلع‌های 3 و 4 و 5: '+m('p = 6')+' و '+m('S = '+S('6 × 3 × 2 × 1')+' = '+S('36')+' = 6')+'.</p><p>اگر دو زاویه‌ی مثلث 50° و 60° باشد، زاویه‌ی سوم '+m('180° − 110° = 70°')+' است.</p>')}
${pr('آیا مثلثی با ضلع‌های 2 و 3 و 6 وجود دارد؟','خیر. '+m('2 + 3 = 5 < 6')+' و شرط نامساوی مثلث برقرار نیست.')}`},

{id:'geometry-2',t:'قضیه‌ی فیثاغورس',s:'رابطه‌ی ضلع‌ها در مثلث قائم‌الزاویه',h:`
<p>در مثلث قائم‌الزاویه، مربع وتر (ضلع روبه‌رو به زاویه‌ی قائمه) برابر مجموع مربع‌های دو ضلع دیگر است. عکس آن هم درست است: اگر در مثلثی این رابطه برقرار باشد، مثلث قائم‌الزاویه است.</p>
${B('a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup>')}
<p>سه‌تایی‌های فیثاغورسی معروف:</p>
${B('(3, 4, 5)    (5, 12, 13)    (8, 15, 17)    (7, 24, 25)')}
${eg('<p>دو ضلع قائمه 6 و 8: '+m('c<sup>2</sup> = 36 + 64 = 100')+' پس '+m('c = 10')+'.</p><p>قطر مستطیل '+m('3 × 4')+': '+m(S('9 + 16')+' = 5')+'.</p><p>قطر مربع به ضلع a: '+m(S('a<sup>2</sup> + a<sup>2</sup>')+' = a'+S('2'))+'.</p>')}
${pr('وتر 13 و یک ضلع 5 است. ضلع دیگر چند است؟',m('b<sup>2</sup> = 169 − 25 = 144')+' پس '+m('b = 12')+'.')}`},

{id:'geometry-3',t:'چهارضلعی‌ها و چندضلعی‌ها',s:'مساحت و مجموع زاویه‌ها',h:`
${tb(['شکل','مساحت'],[['مستطیل',m('S = ab')],['مربع',m('S = a<sup>2</sup>')],['متوازی‌الاضلاع',m('S = a × h')+' (قاعده × ارتفاع)'],['لوزی',m('S = '+F('d<sub>1</sub> d<sub>2</sub>','2'))],['ذوزنقه',m('S = '+F('(a + b) h','2'))]])}
${key('چندضلعی n ضلعی',B(R('مجموع زاویه‌های داخلی:','(n − 2) × 180°'),R('هر زاویه‌ی داخلی (چندضلعی منتظم):',F('(n − 2) × 180°','n')),R('تعداد قطرها:',F('n(n − 3)','2')),R('مجموع زاویه‌های خارجی:','360°')))}
${eg('<p>ذوزنقه با قاعده‌های 6 و 10 و ارتفاع 4: '+m('S = '+F('(6 + 10) × 4','2')+' = 32')+'.</p><p>شش‌ضلعی منتظم: مجموع زاویه‌ها '+m('4 × 180° = 720°')+'، هر زاویه '+m('720° ÷ 6 = 120°')+' و تعداد قطرها '+m(F('6 × 3','2')+' = 9')+'.</p>')}
${pr('مجموع زاویه‌های داخلی پنج‌ضلعی چقدر است؟',m('(5 − 2) × 180° = 540°'))}`},

{id:'geometry-4',t:'دایره',s:'محیط، مساحت، کمان و زاویه‌ها',h:`
${key('فرمول‌ها (شعاع r)',B(R('محیط:','2πr'),R('مساحت:','πr<sup>2</sup>'),R('طول کمان:',F('θ','360°')+' × 2πr'),R('مساحت قطاع:',F('θ','360°')+' × πr<sup>2</sup>')))}
<ul><li>زاویه‌ی مرکزی برابر کمان روبه‌رویش است.</li><li>زاویه‌ی محاطی نصف کمان روبه‌رویش است.</li><li>مماس بر دایره بر شعاع در نقطه‌ی تماس عمود است.</li><li>زاویه‌ی محاطی روبه‌رو به قطر، 90° است.</li></ul>
${eg('<p>دایره‌ای به شعاع 7: محیط '+m('14π ≈ 43.98')+' و مساحت '+m('49π ≈ 153.94')+'.</p><p>قطاع با '+m('r = 6')+' و '+m('θ = 60°')+': '+m(F('60','360')+' × 36π = 6π ≈ 18.85')+'.</p>')}
${pr('مساحت دایره‌ای به شعاع 10 چقدر است؟',m('π × 10<sup>2</sup> = 100π ≈ 314.16'))}`},

{id:'geometry-5',t:'تشابه و قضیه‌ی تالس',s:'مثلث‌های متشابه و نسبت‌ها',h:`
<p>دو مثلث متشابه‌اند اگر زاویه‌های متناظرشان برابر باشد. در این صورت ضلع‌های متناظر متناسب‌اند.</p>
${key('نسبت‌ها',B(R('نسبت طول‌ها و محیط‌ها:','k'),R('نسبت مساحت‌ها:','k<sup>2</sup>'),R('نسبت حجم‌ها:','k<sup>3</sup>'))+'<p>در این‌جا k نسبت تشابه دو شکل است.</p>')}
<h3>قضیه‌ی تالس</h3>
<p>اگر خطی موازی ضلع BC از مثلث ABC، ضلع‌های AB و AC را در D و E قطع کند، آن‌گاه:</p>
${B(F('AD','DB')+' = '+F('AE','EC'))}
${eg('<p>اگر '+m('AD = 4')+'، '+m('DB = 6')+' و '+m('AE = 2')+' باشد، '+m(F('4','6')+' = '+F('2','EC'))+' پس '+m('EC = 3')+'.</p><p>اگر نسبت تشابه دو مثلث 1 به 3 باشد، نسبت مساحت‌ها 1 به 9 است.</p>')}
${pr('چوبی به طول 2 متر سایه‌ای به طول 3 متر دارد. هم‌زمان درختی سایه‌ای 15 متری دارد. ارتفاع درخت؟',m(F('2','3')+' = '+F('h','15')+' ⇒ h = 10')+' متر.')}`},

{id:'geometry-6',t:'حجم و مساحت جسم‌ها',s:'مکعب، استوانه، مخروط و کره',h:`
${tb(['جسم','حجم','مساحت'],[
['مکعب (ضلع a)',m('a<sup>3</sup>'),m('6a<sup>2</sup>')],
['مکعب مستطیل',m('abc'),m('2(ab + bc + ac)')],
['استوانه',m('πr<sup>2</sup>h'),m('2πr(r + h)')+' (کل)'],
['مخروط',m(F('1','3')+'πr<sup>2</sup>h'),m('πr(r + l)')+' (کل)، '+m('l = '+S('r<sup>2</sup> + h<sup>2</sup>'))],
['هرم',m(F('1','3')+' S h')+' (S مساحت قاعده)','مجموع وجه‌ها'],
['کره',m(F('4','3')+'πr<sup>3</sup>'),m('4πr<sup>2</sup>')]])}
${eg('<p>استوانه با '+m('r = 3')+' و '+m('h = 10')+': '+m('V = 90π ≈ 282.74')+'.</p><p>کره‌ی '+m('r = 3')+': '+m('V = '+F('4','3')+' × 27π = 36π ≈ 113.10')+'.</p><p>مخروط با '+m('r = 3')+' و '+m('h = 4')+': مولد '+m('l = 5')+'، حجم '+m(F('1','3')+' × 9π × 4 = 12π')+' و مساحت جانبی '+m('πrl = 15π')+'.</p>')}
${pr('حجم و مساحت کل مکعبی به ضلع 4 چقدر است؟',m('V = 4<sup>3</sup> = 64')+' و '+m('S = 6 × 16 = 96')+'.')}`}
]},

{id:'trig',t:'مثلثات',d:'سینوس، کسینوس، تانژانت، رادیان و اتحادهای مثلثاتی.',c:'#F59E0B',g:'sin',lessons:[
{id:'trig-1',t:'نسبت‌های مثلثاتی',s:'سینوس، کسینوس و تانژانت در مثلث قائم‌الزاویه',h:`
<p>در مثلث قائم‌الزاویه، برای زاویه‌ی حاده‌ی θ سه نسبت اصلی را به این شکل تعریف می‌کنیم:</p>
${key('تعریف',B('sin θ = '+F('ضلع روبه‌رو','وتر'),'cos θ = '+F('ضلع مجاور','وتر'),'tan θ = '+F('ضلع روبه‌رو','ضلع مجاور')+' = '+F('sin θ','cos θ'),'sin<sup>2</sup>θ + cos<sup>2</sup>θ = 1'))}
${tb(['θ','0°','30°','45°','60°','90°'],[
['sin',m('0'),m(F('1','2')),m(F(S('2'),'2')),m(F(S('3'),'2')),m('1')],
['cos',m('1'),m(F(S('3'),'2')),m(F(S('2'),'2')),m(F('1','2')),m('0')],
['tan',m('0'),m(F(S('3'),'3')),m('1'),m(S('3')),'تعریف نشده']])}
${eg('<p>مثلثی با ضلع‌های 3 و 4 و وتر 5: برای زاویه‌ی روبه‌رو به ضلع 3: '+m('sin θ = '+F('3','5'))+'، '+m('cos θ = '+F('4','5'))+'، '+m('tan θ = '+F('3','4'))+'. با ماشین‌حساب '+m('θ = arctan('+F('3','4')+') ≈ 36.87°')+'.</p><p>نردبانی به طول 5 متر با زمین زاویه‌ی 60° می‌سازد. ارتفاع رسیدن آن به دیوار '+m('5 sin 60° = '+F('5'+S('3'),'2')+' ≈ 4.33')+' متر است.</p>')}
${pr('اگر وتر 10 و زاویه‌ی 30° باشد، ضلع روبه‌رو به زاویه چند است؟',m('10 × sin 30° = 10 × '+F('1','2')+' = 5'))}`},

{id:'trig-2',t:'رادیان و دایره‌ی مثلثاتی',s:'تبدیل درجه به رادیان و علامت نسبت‌ها',h:`
<p>رادیان واحد دیگری برای اندازه‌ی زاویه است. زاویه‌ی نیم‌دایره برابر π رادیان است.</p>
${B('π rad = 180°',R('برای تبدیل درجه به رادیان، درجه را در این کسر ضرب کنید:',F('π','180')))}
${tb(['درجه','30°','45°','60°','90°','180°','360°'],[['رادیان',m(F('π','6')),m(F('π','4')),m(F('π','3')),m(F('π','2')),m('π'),m('2π')]])}
<p>روی دایره‌ی مثلثاتی (شعاع 1)، نقطه‌ی متناظر با زاویه‌ی θ مختصات ${m('(cos θ , sin θ)')} دارد.</p>
${circleSvg}
${tb(['ناحیه','sin','cos','tan'],[['اول (0° تا 90°)','+','+','+'],['دوم (90° تا 180°)','+','−','−'],['سوم (180° تا 270°)','−','−','+'],['چهارم (270° تا 360°)','−','+','−']])}
${key('زاویه‌های مرتبط',B('sin(π − θ) = sin θ','cos(π − θ) = −cos θ','sin(−θ) = −sin θ','cos(−θ) = cos θ'))}
${eg('<p>'+m('sin 150° = sin(180° − 30°) = sin 30° = '+F('1','2'))+'.</p><p>'+m('cos 120° = −cos 60° = −'+F('1','2'))+'.</p>')}
${pr('135° را به رادیان تبدیل کنید.',m('135 × '+F('π','180')+' = '+F('3π','4')))}`},

{id:'trig-3',t:'اتحادها و قضیه‌های مثلثاتی',s:'جمع زاویه‌ها، قضیه‌ی سینوس‌ها و کسینوس‌ها',h:`
${key('اتحادهای اصلی',B('sin<sup>2</sup>θ + cos<sup>2</sup>θ = 1','1 + tan<sup>2</sup>θ = '+F('1','cos<sup>2</sup>θ'),'sin 2θ = 2 sin θ cos θ','cos 2θ = cos<sup>2</sup>θ − sin<sup>2</sup>θ = 1 − 2sin<sup>2</sup>θ = 2cos<sup>2</sup>θ − 1','sin(α ± β) = sin α cos β ± cos α sin β','cos(α ± β) = cos α cos β ∓ sin α sin β'))}
${key('در هر مثلث دلخواه ABC',B(R('قضیه‌ی سینوس‌ها:',F('a','sin A')+' = '+F('b','sin B')+' = '+F('c','sin C')+' = 2R'),R('قضیه‌ی کسینوس‌ها:','c<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> − 2ab cos C')))}
<p>قضیه‌ی کسینوس‌ها حالت کلی فیثاغورس است؛ برای ${m('C = 90°')} داریم ${m('cos C = 0')} و به ${m('c<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup>')} می‌رسیم.</p>
${eg('<p>'+m('sin 75° = sin(45° + 30°) = '+F(S('2'),'2')+' · '+F(S('3'),'2')+' + '+F(S('2'),'2')+' · '+F('1','2')+' = '+F(S('6')+' + '+S('2'),'4')+' ≈ 0.966')+'.</p><p>اگر '+m('sin θ = '+F('3','5'))+' باشد، '+m('cos 2θ = 1 − 2 × '+F('9','25')+' = '+F('7','25'))+'.</p><p>کسینوس‌ها: '+m('a = 5')+'، '+m('b = 7')+' و '+m('C = 60°')+': '+m('c<sup>2</sup> = 25 + 49 − 2 × 35 × '+F('1','2')+' = 39')+' پس '+m('c = '+S('39')+' ≈ 6.24')+'.</p><p>سینوس‌ها: '+m('A = 30°')+'، '+m('B = 45°')+' و '+m('a = 5')+': '+m('b = '+F('5 sin 45°','sin 30°')+' = 5'+S('2')+' ≈ 7.07')+'.</p>')}
${pr('اگر θ حاده و '+m('sin θ = '+F('3','5'))+' باشد، cos θ چند است؟',m('cos<sup>2</sup>θ = 1 − '+F('9','25')+' = '+F('16','25'))+' و چون θ حاده است '+m('cos θ = '+F('4','5'))+'.')}`}
]},

{id:'functions',t:'تابع‌ها',d:'مفهوم تابع، خط، سهمی و تابع‌های نمایی و لگاریتمی.',c:'#EC4899',g:'f(x)',lessons:[
{id:'functions-1',t:'مفهوم تابع',s:'دامنه، برد، ترکیب و وارون',h:`
<p><b>تابع</b> قاعده‌ای است که به هر عضو دامنه دقیقاً یک خروجی نسبت می‌دهد. مجموعه‌ی ورودی‌های مجاز <b>دامنه</b> و مجموعه‌ی خروجی‌ها <b>برد</b> نام دارد. در نمودار، هر خط قائم نمودار را حداکثر در یک نقطه قطع می‌کند.</p>
<h3>دامنه‌های رایج</h3>
<ul><li>${m('f(x) = '+F('1','x − 2'))}: مخرج صفر نشود، ${m('x ≠ 2')}.</li><li>${m('f(x) = '+S('x − 1'))}: زیر رادیکال نامنفی باشد، ${m('x ≥ 1')}.</li></ul>
<h3>ترکیب و وارون</h3>
${B('(f ∘ g)(x) = f(g(x))','y = f(x)  ⇒  x = f<sup>−1</sup>(y)')}
<p>وارون فقط برای تابع یک‌به‌یک وجود دارد و نمودار آن قرینه‌ی نمودار تابع نسبت به خط ${m('y = x')} است.</p>
${eg('<p>'+m('f(x) = x<sup>2</sup>')+' و '+m('g(x) = x + 1')+': '+m('(f ∘ g)(x) = (x + 1)<sup>2</sup>')+' و '+m('(g ∘ f)(x) = x<sup>2</sup> + 1')+'. در '+m('x = 2')+' مقدارها 9 و 5 می‌شوند؛ پس ترکیب جابه‌جایی ندارد.</p><p>وارون '+m('f(x) = 2x + 3')+': از '+m('y = 2x + 3')+' نتیجه می‌شود '+m('x = '+F('y − 3','2'))+' پس '+m('f<sup>−1</sup>(x) = '+F('x − 3','2'))+'.</p>')}
${pr('اگر '+m('f(x) = 3x − 1')+' باشد، f(4) چند است؟',m('3 × 4 − 1 = 11'))}`},

{id:'functions-2',t:'تابع خطی و شیب',s:'معادله‌ی خط، فاصله و نقطه‌ی وسط',h:`
${key('خط',B('y = mx + b','m = '+F('y<sub>2</sub> − y<sub>1</sub>','x<sub>2</sub> − x<sub>1</sub>'),'y − y<sub>1</sub> = m(x − x<sub>1</sub>)'))}
<p>m شیب خط و b عرض از مبدأ است. خط‌های موازی شیب برابر دارند و برای خط‌های عمود بر هم ${m('m<sub>1</sub> m<sub>2</sub> = −1')} است.</p>
${key('فاصله و نقطه‌ی وسط',B('d = '+S('(x<sub>2</sub> − x<sub>1</sub>)<sup>2</sup> + (y<sub>2</sub> − y<sub>1</sub>)<sup>2</sup>'),'M = ('+F('x<sub>1</sub> + x<sub>2</sub>','2')+' , '+F('y<sub>1</sub> + y<sub>2</sub>','2')+')'))}
${eg('<p>خط گذرنده از '+m('(1, 2)')+' و '+m('(3, 8)')+': '+m('m = '+F('8 − 2','3 − 1')+' = 3')+' پس '+m('y − 2 = 3(x − 1) ⇒ y = 3x − 1')+'. بررسی: '+m('3(3) − 1 = 8')+'.</p><p>فاصله‌ی '+m('(0, 0)')+' تا '+m('(3, 4)')+': '+m(S('9 + 16')+' = 5')+'.</p>')}
${pr('خط گذرنده از '+m('(0, 1)')+' و '+m('(2, 5)')+' را بنویسید.',m('m = '+F('5 − 1','2 − 0')+' = 2')+' و عرض از مبدأ 1 است: '+m('y = 2x + 1')+'.')}`},

{id:'functions-3',t:'سهمی',s:'رأس، محور تقارن و نمودار تابع درجه دوم',h:`
<p>نمودار ${m('y = ax<sup>2</sup> + bx + c')} یک سهمی است. اگر ${m('a > 0')} رو به بالا و اگر ${m('a < 0')} رو به پایین باز می‌شود.</p>
${key('ویژگی‌ها',B(R('مختصات رأس:','x = '+F('−b','2a')+' ,   y = f('+F('−b','2a')+')'),R('فرم رأسی:','y = a(x − h)<sup>2</sup> + k'),R('عرض از مبدأ:','y = c')))}
${eg('<p>'+m('y = x<sup>2</sup> − 4x + 3')+': رأس در '+m('x = '+F('4','2')+' = 2')+' و '+m('y = 4 − 8 + 3 = −1')+' یعنی '+m('(2, −1)')+'. ریشه‌ها 1 و 3 و عرض از مبدأ 3 است. فرم رأسی: '+m('y = (x − 2)<sup>2</sup> − 1')+'.</p>')}
${parabolaSvg()}
${pr(m('y = −x<sup>2</sup> + 6x')+' چه مقدار بیشینه‌ای دارد؟',m('x = '+F('−6','−2')+' = 3')+' و '+m('y = −9 + 18 = 9')+'. رأس '+m('(3, 9)')+' بالاترین نقطه است.')}`},

{id:'functions-4',t:'تابع نمایی و لگاریتمی',s:'رشد، نیمه‌عمر و نمودارها',h:`
<ul><li>${m('y = a<sup>x</sup>')} ${m('(a > 0 , a ≠ 1)')}: از نقطه‌ی ${m('(0, 1)')} می‌گذرد و محور x مجانب آن است. اگر ${m('a > 1')} صعودی و اگر ${m('0 < a < 1')} نزولی است.</li><li>${m('y = log<sub>a</sub> x')}: وارون تابع نمایی است، دامنه‌اش ${m('x > 0')} است و از ${m('(1, 0)')} می‌گذرد.</li></ul>
${key('کاربردها',B(R('رشد مرکب:','A = P(1 + r)<sup>n</sup>'),R('نیمه‌عمر:','N = N<sub>0</sub> · ('+F('1','2')+')<sup>t/T</sup>')))}
${eg('<p>سرمایه‌ی 1٬000٬000 تومان با سود مرکب 10٪ سالانه بعد از 3 سال: '+m('1000000 × 1.1<sup>3</sup> = 1331000')+' تومان.</p><p>80 گرم ماده با نیمه‌عمر 5 روز بعد از 15 روز: '+m('80 × ('+F('1','2')+')<sup>3</sup> = 10')+' گرم.</p>')}
${pr('معادله‌ی '+m('2<sup>x</sup> = '+F('1','8'))+' را حل کنید.',m(F('1','8')+' = 2<sup>−3</sup>')+' پس '+m('x = −3')+'.')}`}
]},

{id:'stats',t:'آمار و احتمال',d:'میانگین، پراکندگی، احتمال و شمارش.',c:'#06B6D4',g:'σ',lessons:[
{id:'stats-1',t:'میانگین، میانه و مد',s:'معیارهای مرکزی داده‌ها',h:`
${key('تعریف',`<ul><li><b>میانگین:</b> مجموع داده‌ها تقسیم بر تعداد آن‌ها.</li><li><b>میانه:</b> داده‌ی وسط پس از مرتب کردن؛ برای تعداد زوج، میانگین دو داده‌ی وسط.</li><li><b>مد:</b> داده‌ای که بیشترین فراوانی را دارد.</li></ul>`)}
${B('x̄ = '+F('x<sub>1</sub> + x<sub>2</sub> + … + x<sub>n</sub>','n'))}
${eg('<p>داده‌ها: '+m('4, 8, 6, 5, 3, 8, 9')+'. مرتب: '+m('3, 4, 5, 6, 8, 8, 9')+'.</p><p>میانگین '+m(F('43','7')+' ≈ 6.14')+'، میانه 6 (داده‌ی چهارم از هفت داده) و مد 8.</p>')}
${tip('میانگین به داده‌های پرت حساس است، ولی میانه کمتر. برای درآمد افراد یک شهر معمولاً میانه گزارش مناسب‌تری است.')}
${pr('میانگین و میانه‌ی '+m('2, 4, 6, 8')+' چند است؟','میانگین '+m(F('20','4')+' = 5')+' و میانه '+m(F('4 + 6','2')+' = 5')+'.')}`},

{id:'stats-2',t:'واریانس و انحراف معیار',s:'سنجش پراکندگی داده‌ها',h:`
<p>دو مجموعه داده با میانگین یکسان می‌توانند پراکندگی کاملاً متفاوتی داشته باشند. برای سنجش پراکندگی از دامنه‌ی تغییرات (بزرگ‌ترین منهای کوچک‌ترین)، واریانس و انحراف معیار استفاده می‌کنیم.</p>
${key('فرمول‌ها (جامعه)',B('σ<sup>2</sup> = '+F('Σ (x<sub>i</sub> − μ)<sup>2</sup>','n'),'σ = '+S('σ<sup>2</sup>')))}
<p>اگر داده‌ها نمونه‌ای از یک جامعه‌ی بزرگ‌تر باشند، معمولاً مخرج واریانس به‌جای n برابر ${m('n − 1')} گرفته می‌شود.</p>
${eg('<p>داده‌ها: '+m('2, 4, 4, 4, 5, 5, 7, 9')+'. میانگین '+m(F('40','8')+' = 5')+'.</p><p>مربع انحراف‌ها: '+m('9, 1, 1, 1, 0, 0, 4, 16')+' با مجموع 32. واریانس '+m(F('32','8')+' = 4')+' و انحراف معیار '+m('σ = 2')+'.</p>')}
${pr('واریانس جامعه‌ی '+m('1, 3, 5')+' را حساب کنید.','میانگین 3 و مربع انحراف‌ها '+m('4, 0, 4')+'. پس '+m('σ<sup>2</sup> = '+F('8','3')+' ≈ 2.67')+' و '+m('σ ≈ 1.63')+'.')}`},

{id:'stats-3',t:'احتمال',s:'پیشامدها، مکمل، اجتماع و احتمال شرطی',h:`
${key('احتمال کلاسیک',B('P(A) = '+F('تعداد حالت‌های مطلوب','تعداد کل حالت‌های هم‌شانس'),'0 ≤ P(A) ≤ 1','P(A′) = 1 − P(A)','P(A ∪ B) = P(A) + P(B) − P(A ∩ B)'))}
<p>اگر دو پیشامد مستقل باشند، ${m('P(A ∩ B) = P(A) · P(B)')}. احتمال شرطی A به شرط B:</p>
${B('P(A | B) = '+F('P(A ∩ B)','P(B)'))}
${eg('<p>پرتاب یک تاس، عدد زوج: '+m(F('3','6')+' = '+F('1','2'))+'.</p><p>دو تاس با مجموع 7: شش حالت (1,6)، (2,5)، (3,4)، (4,3)، (5,2)، (6,1) از 36 حالت، پس '+m(F('6','36')+' = '+F('1','6'))+'.</p><p>حداقل یک شیر در سه پرتاب سکه: '+m('1 − '+F('1','8')+' = '+F('7','8'))+'.</p><p>تاس زوج به شرط بزرگ‌تر از 3: حالت‌های '+m('{4, 5, 6}')+' و زوج‌ها '+m('{4, 6}')+' پس '+m(F('2','3'))+'.</p>')}
${pr('احتمال آمدن آس از یک دسته‌ی 52‌تایی ورق چقدر است؟',m(F('4','52')+' = '+F('1','13')))}`},

{id:'stats-4',t:'شمارش و ترکیبیات',s:'اصل ضرب، جایگشت و ترکیب',h:`
<p><b>اصل ضرب:</b> اگر کاری در دو مرحله انجام شود و مرحله‌ی اول به m روش و مرحله‌ی دوم به n روش، کل روش‌ها ${m('m × n')} است.</p>
${key('فرمول‌ها',B('n! = n × (n − 1) × … × 2 × 1 ,   0! = 1',R('جایگشت (ترتیب مهم است):','P(n, r) = '+F('n!','(n − r)!')),R('ترکیب (ترتیب مهم نیست):','C(n, r) = '+F('n!','r!(n − r)!')),'C(n, r) = C(n, n − r)'))}
<h3>بسط دوجمله‌ای</h3>
${B('(a + b)<sup>n</sup> = Σ C(n, k) a<sup>n−k</sup> b<sup>k</sup>',R('ضریب‌های بسط '+'(a + b)<sup>4</sup>'+':','1, 4, 6, 4, 1'))}
${eg('<p>چیدن 5 نفر در یک صف: '+m('5! = 120')+'.</p><p>ساخت عدد سه‌رقمی با ارقام متمایز از '+m('{1, 2, 3, 4, 5}')+': '+m('P(5, 3) = 60')+'.</p><p>انتخاب 3 نفر از 5 نفر: '+m('C(5, 3) = 10')+'. انتخاب کمیته‌ای دونفره از 6 نفر: '+m('C(6, 2) = 15')+'.</p>')}
<div class="widget" data-w="comb"></div>
${pr(m('C(8, 2)')+' را حساب کنید.',m(F('8 × 7','2')+' = 28'))}`}
]},

{id:'calculus',t:'حسابان',d:'حد، مشتق، کاربرد مشتق و انتگرال.',c:'#F97316',g:'∫',lessons:[
{id:'calculus-1',t:'حد و پیوستگی',s:'رفتار تابع نزدیک یک نقطه',h:`
<p>${m('lim<sub>x→a</sub> f(x) = L')} یعنی وقتی x به a نزدیک می‌شود (بدون این‌که لزوماً برابر a شود)، مقدار تابع به L نزدیک می‌شود.</p>
<h3>روش‌های محاسبه</h3>
<ol><li>اول جای‌گذاری مستقیم را امتحان کنید.</li><li>اگر به شکل ${m(F('0','0'))} رسیدید، فاکتورگیری و ساده کردن یا گویا کردن را به کار ببرید.</li><li>برای حد در بی‌نهایت، صورت و مخرج را بر بزرگ‌ترین توان x تقسیم کنید.</li></ol>
${key('حدهای مهم',B('lim<sub>x→0</sub> '+F('sin x','x')+' = 1','lim<sub>x→∞</sub> '+F('1','x')+' = 0')+'<p>در حد اول، x برحسب رادیان است.</p>')}
${eg('<p>'+m('lim<sub>x→2</sub> '+F('x<sup>2</sup> − 4','x − 2')+' = lim<sub>x→2</sub> (x + 2) = 4')+'.</p><p>'+m('lim<sub>x→∞</sub> '+F('3x<sup>2</sup> + 1','x<sup>2</sup> + 5')+' = 3')+' (تقسیم بر '+m('x<sup>2</sup>')+').</p>')}
<p>تابع f در a <b>پیوسته</b> است اگر f(a) تعریف شده باشد، حد در a وجود داشته باشد و این دو برابر باشند.</p>
${pr(m('lim<sub>x→3</sub> '+F('x<sup>2</sup> − 9','x − 3'))+' را حساب کنید.',m('lim (x + 3) = 6'))}`},

{id:'calculus-2',t:'مشتق',s:'تعریف و قاعده‌های مشتق‌گیری',h:`
<p>مشتق، شیب خط مماس بر نمودار و آهنگ لحظه‌ای تغییر تابع است.</p>
${B('f′(x) = lim<sub>h→0</sub> '+F('f(x + h) − f(x)','h'))}
${key('قاعده‌های مشتق‌گیری',B('(c)′ = 0','(x<sup>n</sup>)′ = n x<sup>n−1</sup>','(f ± g)′ = f′ ± g′','(f g)′ = f′ g + f g′','('+F('f','g')+')′ = '+F('f′ g − f g′','g<sup>2</sup>'),'(f(g(x)))′ = f′(g(x)) · g′(x)'))}
${tb(['تابع','مشتق'],[[m('sin x'),m('cos x')],[m('cos x'),m('−sin x')],[m('tan x'),m(F('1','cos<sup>2</sup>x'))],[m('e<sup>x</sup>'),m('e<sup>x</sup>')],[m('a<sup>x</sup>'),m('a<sup>x</sup> ln a')],[m('ln x'),m(F('1','x'))]])}
${eg('<p>'+m('(x<sup>3</sup> − 5x<sup>2</sup> + 4x)′ = 3x<sup>2</sup> − 10x + 4')+'.</p><p>ضرب: '+m('(x<sup>2</sup> sin x)′ = 2x sin x + x<sup>2</sup> cos x')+'.</p><p>زنجیره‌ای: '+m('((3x + 1)<sup>5</sup>)′ = 15(3x + 1)<sup>4</sup>')+'.</p><p>خارج‌قسمت: '+m('('+F('x','x + 1')+')′ = '+F('(x + 1) − x','(x + 1)<sup>2</sup>')+' = '+F('1','(x + 1)<sup>2</sup>'))+'.</p><p>خط مماس بر '+m('y = x<sup>2</sup>')+' در '+m('x = 3')+': شیب '+m('f′(3) = 6')+' و نقطه '+m('(3, 9)')+' پس '+m('y = 6x − 9')+'.</p>')}
${pr('مشتق '+m('5x<sup>2</sup> − 3x')+' در '+m('x = 2')+' چند است؟',m('f′(x) = 10x − 3')+' پس '+m('f′(2) = 17')+'.')}`},

{id:'calculus-3',t:'کاربرد مشتق',s:'اکسترمم‌ها و مسئله‌های بهینه‌سازی',h:`
<ul><li>اگر ${m('f′(x) > 0')} روی یک بازه باشد، f روی آن بازه صعودی است و اگر ${m('f′(x) < 0')} باشد، نزولی.</li><li>نقطه‌های بحرانی: جایی که ${m('f′(x) = 0')} یا f′ وجود ندارد.</li><li>آزمون مشتق دوم: اگر ${m('f′(c) = 0')} و ${m('f″(c) > 0')} باشد، c مینیمم موضعی است. اگر ${m('f″(c) < 0')} باشد، ماکزیمم موضعی.</li></ul>
${eg('<p>'+m('f(x) = x<sup>3</sup> − 3x')+': '+m('f′(x) = 3x<sup>2</sup> − 3 = 0')+' پس '+m('x = ±1')+'. '+m('f″(x) = 6x')+': در '+m('x = 1')+' مثبت است و مینیمم با '+m('f(1) = −2')+'؛ در '+m('x = −1')+' منفی است و ماکزیمم با '+m('f(−1) = 2')+'.</p><p><b>بهینه‌سازی:</b> مستطیلی با محیط 40، بیشترین مساحت را چقدر دارد؟ ضلع‌ها x و '+m('20 − x')+': '+m('A = x(20 − x)')+'، '+m('A′ = 20 − 2x = 0')+' پس '+m('x = 10')+'. مستطیل مربعی با ضلع 10 است و مساحت بیشینه 100 است.</p>')}
${pr('مینیمم '+m('f(x) = x<sup>2</sup> − 6x + 5')+' چقدر است؟',m('f′(x) = 2x − 6 = 0 ⇒ x = 3')+' و '+m('f(3) = 9 − 18 + 5 = −4')+'.')}`},

{id:'calculus-4',t:'انتگرال',s:'پادمشتق، انتگرال معین و مساحت',h:`
<p>انتگرال نامعین عکس مشتق است. اگر ${m('F′(x) = f(x)')} باشد، ${m('∫ f(x) dx = F(x) + C')}.</p>
${key('انتگرال‌های پایه',B('∫ x<sup>n</sup> dx = '+F('x<sup>n+1</sup>','n + 1')+' + C     (n ≠ −1)','∫ '+F('1','x')+' dx = ln|x| + C','∫ e<sup>x</sup> dx = e<sup>x</sup> + C','∫ cos x dx = sin x + C','∫ sin x dx = −cos x + C'))}
${key('قضیه‌ی اساسی حسابان',B('∫<sub>a</sub><sup>b</sup> f(x) dx = F(b) − F(a)'))}
<p>انتگرال معین، مساحت علامت‌دار بین نمودار و محور x را می‌دهد.</p>
${eg('<p>'+m('∫ (3x<sup>2</sup> + 2x) dx = x<sup>3</sup> + x<sup>2</sup> + C')+'.</p><p>'+m('∫<sub>0</sub><sup>2</sup> x<sup>2</sup> dx = '+F('x<sup>3</sup>','3')+' |<sub>0</sub><sup>2</sup> = '+F('8','3'))+'.</p><p>مساحت زیر '+m('y = x')+' از 0 تا 4: '+m(F('x<sup>2</sup>','2')+' |<sub>0</sub><sup>4</sup> = 8')+'.</p><p>'+m('∫<sub>0</sub><sup>π</sup> sin x dx = [−cos x]<sub>0</sub><sup>π</sup> = 1 + 1 = 2')+'.</p><p>جای‌گذاری: '+m('∫ 2x(x<sup>2</sup> + 1)<sup>3</sup> dx = '+F('(x<sup>2</sup> + 1)<sup>4</sup>','4')+' + C')+' (با '+m('u = x<sup>2</sup> + 1')+').</p>')}
${pr(m('∫<sub>1</sub><sup>3</sup> 2x dx')+' را حساب کنید.',m('x<sup>2</sup> |<sub>1</sub><sup>3</sup> = 9 − 1 = 8'))}`}
]},

{id:'sets',t:'مجموعه، منطق و ماتریس',d:'مجموعه‌ها، گزاره‌ها و ماتریس‌ها.',c:'#6366F1',g:'{ }',lessons:[
{id:'sets-1',t:'مجموعه‌ها',s:'اجتماع، اشتراک، تفاضل و شمارش',h:`
<p>مجموعه گردایه‌ای از اعضای متمایز است. ${m('a ∈ A')} یعنی a عضو A است و ${m('A ⊆ B')} یعنی هر عضو A عضو B هم هست.</p>
${tb(['عمل','نماد','معنی'],[['اجتماع',m('A ∪ B'),'اعضایی که در A یا B هستند'],['اشتراک',m('A ∩ B'),'اعضای مشترک A و B'],['تفاضل',m('A − B'),'اعضای A که در B نیستند'],['متمم',m('A′'),'اعضای مجموعه‌ی مرجع که در A نیستند']])}
${key('شمارش',B('|A ∪ B| = |A| + |B| − |A ∩ B|',R('تعداد زیرمجموعه‌های مجموعه‌ی n‌عضوی:','2<sup>n</sup>')))}
${eg('<p>'+m('A = {1, 2, 3, 4}')+' و '+m('B = {3, 4, 5}')+': '+m('A ∪ B = {1, 2, 3, 4, 5}')+'، '+m('A ∩ B = {3, 4}')+'، '+m('A − B = {1, 2}')+'. بررسی: '+m('4 + 3 − 2 = 5')+'.</p><p>در کلاسی با 30 دانش‌آموز، 18 نفر فوتبال و 15 نفر والیبال بازی می‌کنند و 5 نفر هر دو. تعداد کسانی که حداقل یکی را بازی می‌کنند '+m('18 + 15 − 5 = 28')+' و 2 نفر هیچ‌کدام را بازی نمی‌کنند.</p>')}
${pr('مجموعه‌ی '+m('{a, b, c}')+' چند زیرمجموعه و چند زیرمجموعه‌ی سره دارد؟',m('2<sup>3</sup> = 8')+' زیرمجموعه. زیرمجموعه‌ی سره یعنی همه به‌جز خود مجموعه: 7.')}`},

{id:'sets-2',t:'منطق ریاضی',s:'گزاره‌ها، جدول ارزش و استدلال',h:`
<p>گزاره جمله‌ای خبری است که دقیقاً یا درست است یا نادرست. گزاره‌ها را با ${m('∧')} (و)، ${m('∨')} (یا)، ${m('¬')} (نقیض)، ${m('⇒')} (اگر… آن‌گاه) و ${m('⇔')} (اگر و فقط اگر) ترکیب می‌کنیم.</p>
${tb(['p','q','p ∧ q','p ∨ q','p ⇒ q','p ⇔ q'],[['د','د','د','د','د','د'],['د','ن','ن','د','ن','ن'],['ن','د','ن','د','د','ن'],['ن','ن','ن','ن','د','د']])}
<p>(د = درست، ن = نادرست). استلزام ${m('p ⇒ q')} فقط وقتی نادرست است که p درست و q نادرست باشد.</p>
${key('هم‌ارزی‌های مهم',B('¬(p ∧ q) ≡ ¬p ∨ ¬q','¬(p ∨ q) ≡ ¬p ∧ ¬q','p ⇒ q ≡ ¬q ⇒ ¬p','¬(p ⇒ q) ≡ p ∧ ¬q')+'<p>هم‌ارزی سوم همان «عکس نقیض» است.</p>')}
<p>عکس یک گزاره (${m('q ⇒ p')}) با خود گزاره هم‌ارز نیست. سورها: ${m('∀')} (برای هر) و ${m('∃')} (وجود دارد)؛ نقیض ${m('∀x P(x)')} برابر ${m('∃x ¬P(x)')} است.</p>
${eg('<p>«اگر باران ببارد، زمین خیس می‌شود.» عکس نقیض آن: «اگر زمین خیس نشود، باران نباریده است.» این دو هم‌ارزند.</p>')}
${pr('نقیض «همه‌ی دانش‌آموزان قبول شدند» چیست؟','«حداقل یک دانش‌آموز قبول نشد.» (نه «هیچ‌کس قبول نشد».)')}`},

{id:'sets-3',t:'ماتریس و دترمینان',s:'ضرب ماتریس‌ها، وارون و حل دستگاه',h:`
<p>ماتریس آرایه‌ای مستطیلی از عددهاست. ماتریس با m سطر و n ستون را ${m('m × n')} می‌گوییم. جمع، درایه‌به‌درایه است و ضرب ${m('AB')} وقتی تعریف می‌شود که تعداد ستون‌های A با تعداد سطرهای B برابر باشد (سطر در ستون).</p>
${key('ماتریس ۲×۲',B('A = '+MX([['a','b'],['c','d']]),'det A = ad − bc','A<sup>−1</sup> = '+F('1','ad − bc')+' '+MX([['d','−b'],['−c','a']])+'     (det A ≠ 0)'))}
${eg('<p>با '+m('A = '+MX([['1','2'],['3','4']]))+' و '+m('B = '+MX([['0','1'],['1','0']]))+':</p><p>'+m('AB = '+MX([['2','1'],['4','3']]))+' و '+m('BA = '+MX([['3','4'],['1','2']]))+'. پس '+m('AB ≠ BA')+' و ضرب ماتریس‌ها جابه‌جایی ندارد.</p><p>'+m('det A = 1 × 4 − 2 × 3 = −2')+' و '+m('A<sup>−1</sup> = '+MX([['−2','1'],[F('3','2'),'−'+F('1','2')]]))+'.</p>')}
<h3>حل دستگاه با قاعده‌ی کرامر</h3>
${B('x = '+F('D<sub>x</sub>','D')+' ,   y = '+F('D<sub>y</sub>','D'))}
${eg('<p>دستگاه '+m('2x + y = 5')+' و '+m('x + 3y = 10')+': '+m('D = 6 − 1 = 5')+'، '+m('D<sub>x</sub> = 5 × 3 − 1 × 10 = 5')+'، '+m('D<sub>y</sub> = 2 × 10 − 5 × 1 = 15')+'. پس '+m('x = 1')+' و '+m('y = 3')+'. بررسی: '+m('2 + 3 = 5')+' و '+m('1 + 9 = 10')+'.</p>')}
${pr('دترمینان '+m(MX([['5','2'],['3','1']]))+' چند است؟',m('5 × 1 − 2 × 3 = −1'))}`}
]}
];

function quizHtml(id){
  const Q=QUIZ[id];if(!Q)return '';
  return `<section class="quiz" id="quiz" data-id="${id}"><h3>آزمون پایان درس</h3><p class="qs">${Q.length} پرسش چهارگزینه‌ای از همین درس. با انتخاب هر گزینه، پاسخ همان لحظه بررسی می‌شود.</p>`+
  Q.map((x,i)=>{
    const opts=x[1].map((t,k)=>({t,ok:k===0}));
    for(let k=opts.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]];}
    return `<div class="qq" data-i="${i}"><p class="qt"><b>${i+1}.</b> ${x[0]}</p><div class="qo">${opts.map(o=>`<button type="button" class="opt" data-ok="${o.ok?1:0}">${o.t}</button>`).join('')}</div><div class="qe" hidden>${x[2]||''}</div></div>`;
  }).join('')+`<div class="qr" id="qres" aria-live="polite" hidden></div></section>`;
}
function bindQuiz(id){
  const sec=document.getElementById('quiz');if(!sec)return;
  const total=QUIZ[id].length;
  sec.addEventListener('click',e=>{
    const b=e.target.closest('.opt');if(!b)return;
    const q=b.closest('.qq');if(q.dataset.done)return;
    q.dataset.done='1';
    const good=b.dataset.ok==='1';
    q.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(o.dataset.ok==='1')o.classList.add('good');});
    if(!good)b.classList.add('bad');
    q.dataset.res=good?'1':'0';
    const ex=q.querySelector('.qe');
    ex.innerHTML=`<b>${good?'درست است.':'نادرست بود. گزینه‌ی سبز پاسخ درست است.'}</b> ${ex.innerHTML}`;
    ex.className='qe '+(good?'g':'w');ex.hidden=false;faConvert(ex);
    const answered=sec.querySelectorAll('.qq[data-done]').length;
    if(answered===total){
      const score=[...sec.querySelectorAll('.qq')].filter(x=>x.dataset.res==='1').length;
      const msg=score===total?'عالی بود! همه‌ی پاسخ‌ها درست است.':score*3>=total*2?'خوب بود. بخش‌های اشتباه را یک بار دیگر مرور کنید.':'یک بار دیگر درس را بخوانید و دوباره آزمون بدهید.';
      const r=document.getElementById('qres');
      r.innerHTML=`<div class="qscore"><b>${score}</b> از ${total}</div><div>${msg}</div><button type="button" class="qretry" id="qretry">آزمون دوباره</button>`;
      r.hidden=false;faConvert(r);
      document.getElementById('qretry').addEventListener('click',()=>{
        sec.outerHTML=quizHtml(id);faConvert(document.getElementById('quiz'));bindQuiz(id);
        document.getElementById('quiz').scrollIntoView({block:'start'});
      });
    }
  });
}

/* ---------- ابزارهای تعاملی ---------- */
function fmt(x){if(!isFinite(x))return '—';if(Math.abs(x)<1e-12)x=0;return String(Math.round(x*10000)/10000).replace('-','−')}
const WIDGETS={
quad(el){
  el.innerHTML=`<div class="wg"><h4>حل‌کننده‌ی معادله‌ی درجه دوم</h4><div class="row" dir="ltr"><label>a <input id="qa" type="number" value="1" step="any"></label><label>b <input id="qb" type="number" value="-5" step="any"></label><label>c <input id="qc" type="number" value="6" step="any"></label></div><div class="out" id="qout" aria-live="polite"></div></div>`;
  const run=()=>{
    const a=parseFloat(el.querySelector('#qa').value),b=parseFloat(el.querySelector('#qb').value),c=parseFloat(el.querySelector('#qc').value);
    const o=el.querySelector('#qout');
    if([a,b,c].some(isNaN)){o.textContent='هر سه ضریب را به‌صورت عدد وارد کنید.';faConvert(o);return}
    let h='';
    if(a===0){
      if(b===0)h=c===0?'معادله به‌ازای هر عدد درست است.':'معادله جواب ندارد.';
      else h='چون a برابر صفر است، معادله‌ی درجه اول است: '+m('x = '+fmt(-c/b));
    }else{
      const D=b*b-4*a*c;
      h='مبین: '+m('Δ = '+fmt(D))+'<br>';
      if(D>0){const r1=(-b+Math.sqrt(D))/(2*a),r2=(-b-Math.sqrt(D))/(2*a);h+='دو ریشه‌ی حقیقی: '+m('x<sub>1</sub> = '+fmt(Math.max(r1,r2))+' ،  x<sub>2</sub> = '+fmt(Math.min(r1,r2)));}
      else if(D===0)h+='یک ریشه‌ی مضاعف: '+m('x = '+fmt(-b/(2*a)));
      else h+='ریشه‌ی حقیقی ندارد. ریشه‌های مختلط: '+m(fmt(-b/(2*a))+' ± '+fmt(Math.sqrt(-D)/(2*Math.abs(a)))+' i');
      h+='<br>رأس سهمی: '+m('('+fmt(-b/(2*a))+' ، '+fmt(c-b*b/(4*a))+')');
    }
    o.innerHTML=h;faConvert(o);
  };
  el.querySelectorAll('input').forEach(i=>i.addEventListener('input',run));run();
},
gcd(el){
  el.innerHTML=`<div class="wg"><h4>ماشین‌حساب ب.م.م و ک.م.م</h4><div class="row" dir="ltr"><label>a <input id="ga" type="number" value="84" min="1" max="1000000" step="1"></label><label>b <input id="gb" type="number" value="36" min="1" max="1000000" step="1"></label></div><div class="out" id="gout" aria-live="polite"></div></div>`;
  const run=()=>{
    const o=el.querySelector('#gout');
    let a=parseInt(el.querySelector('#ga').value,10),b=parseInt(el.querySelector('#gb').value,10);
    if(!(a>=1&&b>=1&&a<=1e6&&b<=1e6)){o.textContent='دو عدد صحیح بین 1 و 1٬000٬000 وارد کنید.';faConvert(o);return}
    const A=a,Bv=b,steps=[];
    while(b){const q=Math.floor(a/b),r=a%b;steps.push(m(a+' = '+q+' × '+b+' + '+r));a=b;b=r}
    const g=a,l=A/g*Bv;
    o.innerHTML='ب.م.م = '+m(String(g))+' و ک.م.م = '+m(String(l))+'<br>مراحل الگوریتم اقلیدس:<br>'+steps.join('<br>');
    faConvert(o);
  };
  el.querySelectorAll('input').forEach(i=>i.addEventListener('input',run));run();
},
comb(el){
  el.innerHTML=`<div class="wg"><h4>ماشین‌حساب جایگشت و ترکیب</h4><div class="row" dir="ltr"><label>n <input id="cn" type="number" value="5" min="0" max="30" step="1"></label><label>r <input id="cr" type="number" value="3" min="0" max="30" step="1"></label></div><div class="out" id="cout" aria-live="polite"></div></div>`;
  const fact=k=>{let f=1n;for(let i=2n;i<=BigInt(k);i++)f*=i;return f};
  const run=()=>{
    const o=el.querySelector('#cout');
    const n=parseInt(el.querySelector('#cn').value,10),r=parseInt(el.querySelector('#cr').value,10);
    if(!(n>=0&&r>=0&&n<=30&&r<=n)){o.textContent='عددهای صحیح با شرط 0 ≤ r ≤ n ≤ 30 وارد کنید.';faConvert(o);return}
    const P=fact(n)/fact(n-r),C=P/fact(r);
    o.innerHTML=m('n! = '+fact(n))+'<br>'+m('P(n, r) = '+P)+'<br>'+m('C(n, r) = '+C);
    faConvert(o);
  };
  el.querySelectorAll('input').forEach(i=>i.addEventListener('input',run));run();
}};

/* ---------- ارقام فارسی ---------- */
function faConvert(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];
  while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{
    const p=n.parentNode&&n.parentNode.nodeName;if(p==='SCRIPT'||p==='STYLE'||p==='TEXTAREA')return;
    const s=n.nodeValue;if(!/[0-9]/.test(s))return;
    n.nodeValue=s.replace(/(\d)\.(\d)/g,'$1٫$2').replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  });
}

/* ---------- ذخیره‌ی پیشرفت (فقط در مرورگر خود شما) ---------- */
let done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem('riazi-yar-done')||'[]'))}catch(e){}
const saveDone=()=>{try{localStorage.setItem('riazi-yar-done',JSON.stringify([...done]))}catch(e){}};

/* ---------- مسیریابی و نمایش ---------- */
const ALL=[];CATS.forEach(c=>c.lessons.forEach(l=>{l.cat=c;ALL.push(l)}));
const view=document.getElementById('view');
const norm=s=>s.replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[‌]/g,' ').toLowerCase();

function cardHtml(c){
  const n=c.lessons.length,d=c.lessons.filter(l=>done.has(l.id)).length;
  return `<a class="card" href="#${c.id}" style="--c:${c.c}"><div class="tile">${c.g}</div><h3>${c.t}</h3><p>${c.d}</p><div class="meta"><span>${n} درس</span><span>${d} از ${n} تمام‌شده</span></div><div class="bar"><i style="width:${n?d/n*100:0}%"></i></div></a>`;
}
function calcPage(){
  view.innerHTML=`<div class="crumbs"><a href="#home">خانه</a> › ماشین‌حساب</div><div id="calc-host"></div>`;
  const host=document.getElementById('calc-host');
  const dt=document.documentElement.getAttribute('data-theme');
  if(dt)host.setAttribute('data-theme',dt);
  const root=host.attachShadow({mode:'open'});
  root.appendChild(document.getElementById('calc-tpl').content.cloneNode(true));
  window.__mountCalc(root);
}
function home(){
  view.innerHTML=`<section class="hero">
    <div class="hero-in"><div>
    <h1>ریاضی را قدم‌به‌قدم یاد بگیر</h1>
    <p>از کسرها و معادله‌ها تا مثلثات، آمار، مشتق و انتگرال. هر درس توضیح ساده، فرمول، مثال حل‌شده و تمرین دارد.</p>
    <div class="by">طراحی و ساخت: <b>صدرا فرح بخشیان</b></div></div>
    <div class="glyphs">${CATS.map(c=>`<a href="#${c.id}" style="--c:${c.c}" aria-label="${c.t}">${c.g}</a>`).join('')}</div></div>
    <div class="searchbox"><input id="q" type="search" placeholder="جست‌وجوی درس، مثلاً فیثاغورس یا مشتق" aria-label="جست‌وجوی درس"></div>
    <div id="results" aria-live="polite"></div>
  </section>
  <h2 class="sec">دسته‌بندی درس‌ها (${ALL.length} درس در ${CATS.length} دسته)</h2>
  <div class="grid">${CATS.map(cardHtml).join('')}</div>`;
  const q=document.getElementById('q'),r=document.getElementById('results');
  q.addEventListener('input',()=>{
    const t=norm(q.value.trim());
    if(!t){r.innerHTML='';return}
    const hits=ALL.filter(l=>norm(l.t+' '+l.s+' '+l.cat.t).includes(t)).slice(0,8);
    const ch=norm('ماشین حساب ماشین‌حساب حل‌کننده calculator').includes(t)?'<a href="#calculator"><b>ماشین‌حساب و حل‌کننده‌ها</b> <small>— ابزار</small></a>':'';
    r.innerHTML=(ch||hits.length)?ch+hits.map(l=>`<a href="#${l.id}"><b>${l.t}</b> <small>— ${l.cat.t}</small></a>`).join(''):'<div style="padding:6px 4px">درسی پیدا نشد.</div>';
    faConvert(r);
  });
}
function category(c){
  view.innerHTML=`<div class="crumbs"><a href="#home">خانه</a> › ${c.t}</div>
  <div class="cathead" style="--c:${c.c}"><div class="tile">${c.g}</div><div><h1>${c.t}</h1><p>${c.d}</p></div></div>
  <div class="lrows" style="--c:${c.c}">${c.lessons.map((l,i)=>`<a class="lrow${done.has(l.id)?' done':''}" href="#${l.id}"><span class="num">${done.has(l.id)?'✓':i+1}</span><span><b>${l.t}</b><span class="s">${l.s}</span></span></a>`).join('')}</div>`;
}
function sideHtml(cur){
  return CATS.map(c=>`<details style="--c:${c.c}"${c===cur.cat?' open':''}><summary><span class="dot">${c.g}</span>${c.t}</summary>${c.lessons.map(x=>`<a class="sl${x===cur?' on':''}${done.has(x.id)?' ok':''}" href="#${x.id}">${x.t}</a>`).join('')}</details>`).join('');
}
function lesson(l){
  const c=l.cat,i=ALL.indexOf(l),prev=ALL[i-1],next=ALL[i+1];
  view.innerHTML=`<div class="layout" style="--c:${c.c}"><aside class="side" aria-label="فهرست درس‌ها">${sideHtml(l)}</aside><div class="main">
  <div class="crumbs"><a href="#home">خانه</a> › <a href="#${c.id}">${c.t}</a> › ${l.t}</div>
  <nav class="chips" aria-label="درس‌های ${c.t}">${c.lessons.map((x,k)=>`<a href="#${x.id}"${x===l?' class="on" aria-current="page"':''}>${k+1}. ${x.t}</a>`).join('')}</nav>
  <article class="lesson"><h1>${l.t}</h1><p class="lead">${l.s}</p>${l.h}${quizHtml(l.id)}
  <button class="donebtn${done.has(l.id)?' on':''}" id="donebtn" type="button">${done.has(l.id)?'✓ این درس را تمام کرده‌ام':'این درس را تمام کردم'}</button></article>
  <div class="pn">${next?`<a href="#${next.id}"><small>درس بعدی ‹</small><b>${next.t}</b></a>`:'<span></span>'}${prev?`<a href="#${prev.id}"><small>› درس قبلی</small><b>${prev.t}</b></a>`:'<span></span>'}</div></div></div>`;
  view.querySelectorAll('.widget').forEach(el=>{const f=WIDGETS[el.dataset.w];if(f)f(el)});
  bindQuiz(l.id);
  const b=document.getElementById('donebtn');
  b.addEventListener('click',()=>{
    if(done.has(l.id))done.delete(l.id);else done.add(l.id);
    saveDone();b.classList.toggle('on',done.has(l.id));
    const sl=view.querySelector('.side a.on');if(sl)sl.classList.toggle('ok',done.has(l.id));
    b.textContent=done.has(l.id)?'✓ این درس را تمام کرده‌ام':'این درس را تمام کردم';
  });
}
function route(){
  const h=(location.hash||'#home').slice(1);
  const l=ALL.find(x=>x.id===h),c=CATS.find(x=>x.id===h);
  if(h==='calculator')calcPage();else if(l)lesson(l);else if(c)category(c);else home();
  const inCalc=h==='calculator';
  [['nav-calc',inCalc],['nav-less',!inCalc]].forEach(([id,on])=>{const e=document.getElementById(id);e.classList.toggle('on',on);if(on)e.setAttribute('aria-current','page');else e.removeAttribute('aria-current');});
  const by=document.getElementById('by-line');if(by)by.hidden=inCalc;
  faConvert(view);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
</script>
