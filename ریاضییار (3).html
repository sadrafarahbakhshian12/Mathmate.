<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ریاضی‌یار</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=Lalezar&family=STIX+Two+Text:wght@400;600&display=swap">
<style>
/* Layout: سربرگ ساده، قهرمان رنگی با نماد دسته‌ها، شبکه‌ی کارت دسته‌ها، صفحه‌ی درس تک‌ستونه با نوار درس‌های همان دسته */
:root{
  --bg:#F2F8FF; --surface:#FFFFFF; --fg:#1B2A4E; --muted:#5A6B8F; --line:#DAE5F5;
  --brand:#3B6EF5; --brand-ink:#FFFFFF; --hero-a:#D9EEFF; --hero-b:#FFE6F1; --soft:#EAF2FF;
  --good:#0E9F6E; --calc:#0F766E; --calc-ink:#FFFFFF; --bad:#C62828; --warn-bg:#FFF4D6; --warn-fg:#7A5200;
  --font-body:'Vazirmatn',Tahoma,'Segoe UI',sans-serif; --font-display:'Lalezar','Vazirmatn',Tahoma,sans-serif;
  --font-math:'STIX Two Text','Vazirmatn','Cambria Math',serif;
  --c:#3B82F6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A33; --surface:#16244A; --fg:#E9EFFF; --muted:#9FB1D8; --line:#2A3B6C;
  --brand:#7FA2FF; --brand-ink:#0F1A33; --hero-a:#1B3A6B; --hero-b:#4A2447; --soft:#1D2D58;
  --good:#4ADE9B; --calc:#2DD4BF; --calc-ink:#0F1A33; --bad:#FF8A80; --warn-bg:#3D3112; --warn-fg:#FFD97A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A33; --surface:#16244A; --fg:#E9EFFF; --muted:#9FB1D8; --line:#2A3B6C;
  --brand:#7FA2FF; --brand-ink:#0F1A33; --hero-a:#1B3A6B; --hero-b:#4A2447; --soft:#1D2D58;
  --good:#4ADE9B; --calc:#2DD4BF; --calc-ink:#0F1A33; --bad:#FF8A80; --warn-bg:#3D3112; --warn-fg:#FFD97A; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.95}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--font-math);font-size:26px;line-height:1}
.brand b{font-family:var(--font-display);font-size:24px;font-weight:400;line-height:1.2;display:block}
.brand small{color:var(--muted);font-size:12px;display:block;line-height:1.4}
.homelink{padding:6px 14px;border-radius:999px;background:var(--soft);font-weight:700;font-size:14px}

/* hero */
.hero{margin-top:20px;border-radius:26px;padding:28px 22px;background:linear-gradient(120deg,var(--hero-a),var(--hero-b));border:1px solid var(--line)}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.5;margin:0;text-wrap:balance}
.hero p{margin:6px 0 0;max-width:60ch;color:var(--fg)}
.by{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.by b{color:var(--brand)}
.glyphs{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.glyphs a{min-width:46px;height:46px;padding:0 10px;border-radius:14px;display:grid;place-items:center;font-family:var(--font-math);font-size:21px;background:color-mix(in srgb,var(--c) 22%,var(--surface));color:color-mix(in srgb,var(--c) 70%,var(--fg));border:1px solid color-mix(in srgb,var(--c) 35%,var(--surface))}
.searchbox{margin-top:18px;display:flex;gap:8px}
.searchbox input{flex:1;min-width:0;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
#results{margin-top:10px;display:grid;gap:6px}
#results a{display:block;padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
#results small{color:var(--muted)}

h2.sec{font-size:22px;margin:30px 0 12px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;transition:transform .15s,border-color .15s;min-width:0}
.card:hover{transform:translateY(-2px);border-color:var(--c)}
.tile{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-family:var(--font-math);font-size:25px;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:color-mix(in srgb,var(--c) 72%,var(--fg))}
.card h3{margin:4px 0 0;font-size:18px;font-weight:800}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.8}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:auto;padding-top:6px}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px}

/* category page */
.crumbs{margin:18px 0 6px;font-size:14px;color:var(--muted)}
.crumbs a{color:var(--brand);font-weight:500}
.cathead{display:flex;gap:16px;align-items:center;padding:20px;border-radius:22px;background:color-mix(in srgb,var(--c) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.cathead h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:32px;line-height:1.4}
.cathead p{margin:0;color:var(--muted)}
.lrow{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:10px}
.lrow:hover{border-color:var(--c)}
.num{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:color-mix(in srgb,var(--c) 72%,var(--fg))}
.lrow.done .num{background:var(--good);color:var(--brand-ink)}
.lrow b{display:block;line-height:1.6}
.lrow span.s{color:var(--muted);font-size:14px;line-height:1.7;display:block}

/* lesson */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin-top:6px}
.chips a{flex:none;padding:5px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;white-space:nowrap}
.chips a.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:700}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 20px;margin-top:6px}
.lesson h1{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,5vw,36px);line-height:1.5;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 10px}
.lesson h3{font-size:19px;font-weight:800;margin:26px 0 6px;color:color-mix(in srgb,var(--c) 70%,var(--fg))}
.lesson h4{margin:0 0 8px;font-size:16px}
.lesson p{margin:8px 0;max-width:70ch}
.lesson ul,.lesson ol{padding-right:22px;padding-left:0;margin:8px 0}
.lesson li{margin:4px 0}
.m{font-family:var(--font-math);direction:ltr;unicode-bidi:isolate;white-space:normal;font-size:1.08em}
.fb{display:flex;flex-direction:column;align-items:center;gap:6px;margin:12px 0;padding:14px 10px;border-radius:14px;background:var(--soft);overflow-x:auto;font-size:1.25em;line-height:1.7}
.fb>div{text-align:center;max-width:100%}
.fb>div.rl{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.15em .5em;font-family:var(--font-body);font-size:.78em;line-height:1.9;direction:rtl;unicode-bidi:isolate}
.fb>div.rl .m{font-size:1.28em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .2em;line-height:1.35;font-size:.95em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .25em}
.fr>span:last-child{padding:0 .25em}
.sq{white-space:nowrap}.ov{border-top:1.5px solid currentColor;padding:0 .12em;margin-left:1px}
.key,.eg,.tip{border-radius:16px;padding:14px 16px;margin:16px 0}
.key{background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 32%,var(--line))}
.eg{background:var(--surface);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line))}
.tip{background:var(--warn-bg);color:var(--warn-fg)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:0 10px;border-radius:99px;background:var(--c);color:#fff;margin-bottom:4px;line-height:1.8}
.tip .tag{background:var(--warn-fg);color:var(--warn-bg)}
.eg p:last-child,.key p:last-child,.tip p:last-child{margin-bottom:0}
.tw{overflow-x:auto;margin:12px 0;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 12px;text-align:center;border-bottom:1px solid var(--line);line-height:1.7}
th{background:var(--soft);font-weight:700}
tr:last-child td{border-bottom:0}
td.r{text-align:right}
.pr{margin:18px 0;border-radius:16px;background:color-mix(in srgb,var(--good) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--good) 35%,var(--line))}
.pr summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none}
.pr summary::before{content:"تمرین: ";color:var(--good)}
.pr>div{padding:0 16px 14px}
.wg{margin:18px 0;padding:16px;border-radius:18px;background:var(--soft);border:1px solid var(--line)}
.wg .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.wg label{display:flex;align-items:center;gap:6px;font-weight:700}
.wg input{width:92px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;direction:ltr;text-align:center}
.wg .out{margin-top:12px;line-height:2}
.mx{display:inline-block;vertical-align:middle;padding:0 .4em;border-left:2px solid currentColor;border-right:2px solid currentColor;border-radius:5px;margin:0 .25em}
.mxg{display:grid;gap:.1em 1em;text-align:center}
.svgbox{max-width:340px;margin:14px auto}
.svgbox svg{width:100%;height:auto;direction:ltr;color:var(--fg)}
.svgbox text{fill:var(--fg);font-family:var(--font-math);font-size:13px}
.donebtn{margin-top:22px;padding:10px 20px;border-radius:999px;border:1.5px solid var(--good);background:transparent;color:var(--good);font:inherit;font-weight:700;cursor:pointer}
.donebtn.on{background:var(--good);color:var(--brand-ink)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.pn a{padding:12px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-width:0}
.pn a small{display:block;color:var(--muted);font-size:12px}
.pn a:last-child{text-align:left}
.pn a:hover{border-color:var(--brand)}
footer{margin-top:40px;padding-block:24px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:14px}
footer b{color:var(--fg)}
/* دسکتاپ و لپ‌تاپ */
.layout{display:block}.side{display:none}
.hero-in{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);align-items:center}
.lrows{display:block}
.side details{margin:2px 0}
.side summary{cursor:pointer;padding:8px 10px;border-radius:12px;font-weight:700;list-style:none;display:flex;align-items:center;gap:10px}
.side summary::-webkit-details-marker{display:none}
.side summary:hover{background:var(--soft)}
.dot{min-width:30px;height:30px;padding:0 6px;border-radius:9px;display:grid;place-items:center;font-family:var(--font-math);font-size:14px;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:color-mix(in srgb,var(--c) 72%,var(--fg))}
.side a.sl{display:block;padding:5px 12px 5px 8px;margin-right:40px;border-radius:10px;font-size:14.5px;line-height:1.7;color:var(--muted)}
.side a.sl:hover{background:var(--soft)}
.side a.sl.on{background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--fg);font-weight:700}
.side a.sl.ok::after{content:" ✓";color:var(--good)}
@media (min-width:900px){
  body{font-size:17px}
  .top .wrap{padding-block:14px}
  .layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:26px;align-items:start;margin-top:12px}
  .side{display:block;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px}
  .chips{display:none}
  .hero{padding:44px 44px 36px;margin-top:26px}
  .hero-in{grid-template-columns:1.25fr 1fr;gap:30px}
  .glyphs{margin-top:0;justify-content:center;gap:12px}
  .glyphs a{min-width:70px;height:70px;font-size:28px;border-radius:20px}
  .lrows{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lrows .lrow{margin-top:0}
  .lesson{padding:36px 44px}
  .lesson p,.lesson li{font-size:17.5px}
  .cathead{padding:28px}
}
@media (max-width:520px){
  .pn{grid-template-columns:1fr}.pn a:last-child{text-align:right}
  .lesson{padding:18px 14px;border-radius:20px}
  .fb{font-size:1.08em;padding:12px 8px}
  .key,.eg,.tip{padding:12px 12px}
  table{font-size:13.5px}th,td{padding:6px 7px}
  .cathead{flex-direction:column;align-items:flex-start}
  .hero{padding:22px 16px}
}
.cathead>div,.lrow>span,.lrow>span>b{min-width:0}
.lesson,.key,.eg,.tip,.pr{overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.hnav{display:flex;gap:8px;flex-wrap:wrap}
.hnav a{display:inline-flex;align-items:center;gap:8px;background:var(--soft);color:var(--fg);transition:background .15s,color .15s}
.hnav a:hover{background:color-mix(in srgb,var(--fg) 12%,var(--soft))}
.hnav a.calcbtn.on{background:var(--calc);color:var(--calc-ink)}
.hnav a.lessbtn.on{background:var(--brand);color:var(--brand-ink)}
.eqs{width:22px;height:22px;border-radius:7px;background:color-mix(in srgb,currentColor 18%,transparent);display:grid;place-items:center;font-family:var(--font-math);font-size:16px;line-height:1}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:14px;margin-inline-start:8px;padding:9px 20px;border-radius:999px;background:var(--calc);color:var(--calc-ink);font-weight:800}
.cta:hover{filter:brightness(1.08)}
.card.calc{grid-column:1/-1;background:color-mix(in srgb,var(--c) 11%,var(--surface));border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.side .sl-calc{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:6px;border-radius:12px;background:var(--calc);color:var(--calc-ink);font-weight:800}
#calc-host{display:block;margin-top:6px}

.quiz{margin-top:30px;padding:18px 16px;border-radius:20px;background:color-mix(in srgb,var(--c) 8%,var(--surface));border:1.5px solid color-mix(in srgb,var(--c) 35%,var(--line))}
.quiz h3{margin:0 0 2px;font-size:21px}
.quiz .qs{margin:0 0 6px;color:var(--muted);font-size:14.5px}
.qq{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.qq:first-of-type{border-top:0;padding-top:4px}
.qt{margin:0 0 8px;font-weight:700;max-width:none}
.qo{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.opt{font:inherit;text-align:right;line-height:1.7;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;min-width:0;overflow-wrap:anywhere;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.opt:disabled{cursor:default;color:var(--fg)}
.opt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface));font-weight:700}
.opt.good::after{content:" ✓";color:var(--good)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--surface))}
.opt.bad::after{content:" ✗";color:var(--bad)}
.qe{margin-top:8px;padding:8px 12px;border-radius:12px;font-size:15px;line-height:1.8}
.qe.g{background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.qe.w{background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.qr{margin-top:18px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1.5px solid var(--c);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.qscore{font-size:20px;font-weight:800}.qscore b{font-size:28px;color:var(--c)}
.qretry{font:inherit;font-weight:700;padding:7px 18px;border-radius:999px;border:1.5px solid var(--c);background:transparent;color:var(--fg);cursor:pointer;margin-inline-start:auto}
.qretry:hover{background:color-mix(in srgb,var(--c) 14%,var(--surface))}
@media (max-width:520px){.quiz{padding:14px 12px}.qo{grid-template-columns:1fr}}
</style>

<div id="app" dir="rtl" lang="fa">
  <header class="top"><div class="wrap">
    <a class="brand" href="#home" aria-label="صفحه‌ی اصلی ریاضی‌یار">
      <span class="logo">π</span>
      <span><b>ریاضی‌یار</b><small>آموزش ریاضی از پایه تا حسابان</small></span>

<template id="calc-tpl"><style>
/* Layout: a rounded hero, a wrapping row of colour-coded topic chips, then one panel of live solver cards per topic. Each topic owns one colour. */
:host{display:block;
  --bg:#f4f5fc; --surface:#ffffff; --surface2:#eef0fa; --fg:#1a1d3b; --muted:#585e83; --line:#dde0f1; --on-c:#ffffff; --err:#b42318;
  --c-arith:#d9363e; --c-alg:#b45309; --c-geo:#047857; --c-trig:#0369a1; --c-stat:#7c3aed; --c-calc:#db2777; --c-comb:#0f766e;
  --shadow:0 1px 2px rgba(26,29,59,.06),0 10px 28px rgba(26,29,59,.07);
  --font-display:'Lalezar','Vazirmatn',Tahoma,system-ui,sans-serif;
  --font-body:'Vazirmatn',Tahoma,system-ui,'Segoe UI',sans-serif;
  --font-mono:ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :host(:not([data-theme="light"])){
    --bg:#0e1023; --surface:#171a35; --surface2:#1f2343; --fg:#eceefc; --muted:#a4aacd; --line:#2b3058; --on-c:#0e1023; --err:#ff9b92;
    --c-arith:#ff7a80; --c-alg:#fbbf24; --c-geo:#34d399; --c-trig:#38bdf8; --c-stat:#a78bfa; --c-calc:#f472b6; --c-comb:#2dd4bf;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:host([data-theme="dark"]){
  --bg:#0e1023; --surface:#171a35; --surface2:#1f2343; --fg:#eceefc; --muted:#a4aacd; --line:#2b3058; --on-c:#0e1023; --err:#ff9b92;

}
*{box-sizing:border-box}
.wrapper{color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.75}
.t-arith{--c:var(--c-arith)} .t-alg{--c:var(--c-alg)} .t-geo{--c:var(--c-geo)} .t-trig{--c:var(--c-trig)}
.t-stat{--c:var(--c-stat)} .t-calc{--c:var(--c-calc)} .t-comb{--c:var(--c-comb)}
.page{max-width:1080px;margin:0 auto;padding-block:20px 40px}

.hero{position:relative;overflow:hidden;border-radius:28px;padding:30px 26px 24px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line)}
.hero>*{position:relative;z-index:1}
.glyph{position:absolute!important;z-index:0!important;font-family:var(--font-display);line-height:1;opacity:.17;pointer-events:none;user-select:none}
.g1{left:4%;top:-6px;font-size:120px;color:var(--c-stat)}
.g2{left:22%;bottom:-18px;font-size:110px;color:var(--c-calc)}
.g3{left:38%;top:6px;font-size:70px;color:var(--c-trig)}
.g4{left:11%;bottom:6px;font-size:64px;color:var(--c-arith)}
.g5{left:50%;bottom:-8px;font-size:84px;color:var(--c-alg)}
.kicker{margin:0;color:var(--muted);font-weight:500}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(40px,9vw,68px);line-height:1.15;margin:2px 0 6px;text-wrap:balance}
.lead{margin:0;max-width:52ch;color:var(--muted);font-size:16px}
.credit{margin:14px 0 0;color:var(--muted);font-size:14px}
.credit b{color:var(--fg);font-weight:800}
.spectrum{display:flex;height:7px;border-radius:99px;overflow:hidden;margin-top:20px}
.spectrum i{flex:1}

.tabs{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 20px}
.tab{
  appearance:none;border:1.5px solid color-mix(in srgb,var(--c) 38%,var(--line));background:var(--surface);color:var(--fg);
  font:inherit;font-weight:700;padding:6px 16px 6px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:9px;cursor:pointer;
  transition:background .15s,color .15s,border-color .15s,transform .15s;
}
.tab:hover{transform:translateY(-2px)}
.tab .g{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--c) 17%,transparent);color:var(--c);font-family:var(--font-display);font-weight:400;font-size:18px;line-height:1;padding-bottom:2px}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:var(--on-c)}
.tab[aria-selected="true"] .g{background:color-mix(in srgb,var(--on-c) 22%,transparent);color:var(--on-c)}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--c,var(--fg)) 55%,transparent);outline-offset:2px}

.phead{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.phead .big{flex:none;display:grid;place-items:center;width:54px;height:54px;border-radius:18px;background:var(--c);color:var(--on-c);font-family:var(--font-display);font-size:32px;line-height:1;padding-bottom:4px}
.phead h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.2;color:var(--c)}
.phead p{margin:0;color:var(--muted)}

.panel{animation:rise .24s ease-out}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
.wide{grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 4px;font-size:17px;font-weight:800;color:var(--c)}
.hint{margin:0 0 12px;color:var(--muted);font-size:13px}
.sub{margin:8px 0 0;color:var(--muted);font-size:14px}

input,select{font:inherit;color:var(--fg);background:var(--surface2);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0;width:100%}
input:focus-visible,select:focus-visible{border-color:var(--c)}
.ltr{direction:ltr;text-align:left;font-family:var(--font-mono);font-size:15px}
.big{font-size:18px}
.calc-row{display:grid;grid-template-columns:1fr 110px;gap:10px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:6px}
.fld{display:grid;gap:3px;min-width:0}
.fld label{font-size:13px;color:var(--muted);font-weight:500}
.eq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;direction:ltr;font-family:var(--font-mono);font-size:17px;margin:6px 0}
.eq input{width:78px;text-align:center;direction:ltr;padding:8px 6px}
.eq.tight input{width:68px}

.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin-top:10px}
.keys button,.chips button{
  appearance:none;font:inherit;font-weight:700;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:7px 0;cursor:pointer;direction:ltr;
  transition:background .12s,transform .12s;
}
.keys button:hover,.chips button:hover{background:color-mix(in srgb,var(--c) 16%,var(--surface2))}
.keys button:active,.chips button:active{transform:scale(.95)}
.keys button.op{color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{padding:4px 12px;border-radius:999px;font-size:13px}

.res{background:color-mix(in srgb,var(--c) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 22%,var(--line));border-radius:14px;padding:12px 14px;margin-top:12px;min-height:48px}
.ans{font-size:20px;font-weight:800;color:color-mix(in srgb,var(--c) 78%,var(--fg));line-height:1.7}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.steps{margin:8px 0 0;padding-inline-start:26px;list-style-type:persian}
.steps li{margin:4px 0}
.steps li::marker{color:var(--c);font-weight:800}
.err{color:var(--err);font-weight:500}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px}
.kv>div{background:var(--surface);border:1px solid color-mix(in srgb,var(--c) 18%,var(--line));border-radius:12px;padding:8px 12px;min-width:0}
.kv small{display:block;color:var(--muted);font-size:12px;line-height:1.5}
.kv b{font-size:17px;font-weight:800;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tags span{background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));padding:2px 12px;border-radius:999px;font-weight:700;direction:ltr;font-variant-numeric:tabular-nums}
.plot{width:100%;height:auto;display:block;direction:ltr;margin-top:12px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.plot .tx{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.plot .gl{stroke:var(--line);stroke-width:1}
.plot .ax{stroke:var(--muted);stroke-width:1.3}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:640px){.split{grid-template-columns:minmax(0,1fr)}}
.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.tab,.keys button,.chips button{transition:none}}

var grp=function(s){return s.replace(/\B(?=(\d{3})+(?!\d))/g,'٬');};

function fmt(x){
  if(typeof x==='bigint'){var n=x<0n;return (n?'−':'')+fa(grp((n?-x:x).toString()));}
  if(typeof x!=='number'||!isFinite(x))return 'تعریف‌نشده';
  if(Math.abs(x)<1e-12)x=0;
  var s=String(parseFloat(x.toPrecision(12)));var neg=s[0]==='-';if(neg)s=s.slice(1);
  if(s.indexOf('e')>-1){var t=s.split('e');return (neg?'−':'')+fa(t[0]).replace('.','٫')+'×۱۰<sup>'+fa(t[1].replace('+','').replace('-','−'))+'</sup>';}
  var p=s.split('.');
  return (neg?'−':'')+fa(grp(p[0]))+(p[1]?'٫'+fa(p[1]):'');
}
function toFrac(x){
  if(!isFinite(x)||Number.isInteger(x))return null;
  var h1=1,h0=0,k1=0,k0=1,b=x;
  for(var i=0;i<24;i++){
    var a=Math.floor(b),h2=a*h1+h0,k2=a*k1+k0;h0=h1;h1=h2;k0=k1;k1=k2;
    if(Math.abs(x-h1/k1)<1e-10)break;
    var fr=b-a;if(fr<1e-12)break;b=1/fr;if(k1>5000)return null;
  }
  if(k1>1000||Math.abs(x-h1/k1)>1e-9)return null;
  return {p:h1,q:k1};
}
function fmtF(x){var f=toFrac(x);return f?fmt(f.p)+'/'+fmt(f.q)+' ('+fmt(x)+')':fmt(x);}
var par=function(n){return n<0?'('+fmt(n)+')':fmt(n);};
var sg=function(n){return n<0?'− '+fmt(-n):'+ '+fmt(n);};
var fmtS=function(x){return fmt(x).replace(/<[^>]+>/g,'');};

function norm(s){
  return String(s).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d);})
    .replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);})
    .replace(/[×✕]/g,'*').replace(/÷/g,'/').replace(/٫/g,'.').replace(/٬/g,'').replace(/[،؛]/g,',')
    .replace(/[−–—]/g,'-').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/²/g,'^2').replace(/³/g,'^3').replace(/٪/g,'%');
}

/* Safe recursive-descent expression evaluator */
function ev(src,deg){
  var s=norm(src).replace(/\s+/g,'');
  if(!s)throw new Error('empty');
  var i=0;
  var d2r=function(x){return x*Math.PI/180;},r2d=function(x){return x*180/Math.PI;};
  var F={sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,ln:Math.log,log:Math.log10,exp:Math.exp,
    sin:function(x){return Math.sin(deg?d2r(x):x);},cos:function(x){return Math.cos(deg?d2r(x):x);},tan:function(x){return Math.tan(deg?d2r(x):x);},
    asin:function(x){return deg?r2d(Math.asin(x)):Math.asin(x);},acos:function(x){return deg?r2d(Math.acos(x)):Math.acos(x);},atan:function(x){return deg?r2d(Math.atan(x)):Math.atan(x);}};
  var K={pi:Math.PI,e:Math.E};
  var isL=function(c){return c!==undefined&&/[a-zA-Z]/.test(c);};
  var isD=function(c){return c!==undefined&&/[0-9.]/.test(c);};
  function expr(){var v=term();while(s[i]==='+'||s[i]==='-'){var o=s[i++];var r=term();v=o==='+'?v+r:v-r;}return v;}
  function term(){var v=unary();for(;;){var c=s[i];if(c==='*'){i++;v*=unary();}else if(c==='/'){i++;v/=unary();}else if(c==='('||isL(c)||isD(c)){v*=unary();}else break;}return v;}
  function unary(){if(s[i]==='-'){i++;return -unary();}if(s[i]==='+'){i++;return unary();}return power();}
  function power(){var b=post();if(s[i]==='^'){i++;return Math.pow(b,unary());}return b;}
  function post(){var v=prim();for(;;){if(s[i]==='!'){i++;v=fct(v);}else if(s[i]==='%'){i++;v/=100;}else break;}return v;}
  function fct(v){if(!Number.isInteger(v)||v<0||v>170)return NaN;var r=1;for(var k=2;k<=v;k++)r*=k;return r;}
  function prim(){
    var c=s[i];
    if(c==='('){i++;var v=expr();if(s[i]!==')')throw new Error('paren');i++;return v;}
    if(isD(c)){var m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));if(!m)throw new Error('num');i+=m[0].length;return parseFloat(m[0]);}
    if(isL(c)){var nm=/^[a-zA-Z]+/.exec(s.slice(i))[0];i+=nm.length;
      if(F[nm])return F[nm](post());
      if(K.hasOwnProperty(nm))return K[nm];
      throw new Error('name');}
    throw new Error('syntax');
  }
  var out=expr();if(i<s.length)throw new Error('extra');return out;
}

  else if(t==='B'){el.value=el.value.slice(0,-1);}
  else{
    var s=typeof el.selectionStart==='number'?el.selectionStart:el.value.length;
    var e=typeof el.selectionEnd==='number'?el.selectionEnd:s;
    el.value=el.value.slice(0,s)+t+el.value.slice(e);

  }

}

function calcPct(){

  else if(m==='2'){if(y===0){r.innerHTML=err('y نمی‌تواند صفر باشد.');return;}a=x/y*100;ans=M(fmt(a)+'%');st=M(fmt(x)+' ÷ '+fmt(y)+' × ۱۰۰ = '+fmt(a)+'%');}
  else{if(x===0){r.innerHTML=err('x نمی‌تواند صفر باشد.');return;}a=(y-x)/Math.abs(x)*100;ans=(a>=0?'افزایش ':'کاهش ')+M(fmt(Math.abs(a))+'%');st=M('('+fmt(y)+' − '+par(x)+') ÷ '+fmt(Math.abs(x))+' × ۱۰۰ = '+fmt(a)+'%');}

function calcGcd(){
  var r=$('gcd-res');
  var nums=norm($('gl').value).split(/[,\s]+/).filter(Boolean).map(Number);
  if(nums.length<2||nums.some(function(n){return !Number.isInteger(n)||n<=0||n>1e12;})){r.innerHTML=err('دست‌کم دو عدد صحیح مثبت (حداکثر هزار میلیارد) وارد کنید.');return;}
  var B=nums.map(function(n){return BigInt(n);});
  var g2=function(a,b){while(b){var t=a%b;a=b;b=t;}return a;};
  var g=B.reduce(g2),l=B.reduce(function(a,b){return a/g2(a,b)*b;});
  var a=B[0],b=B[1];if(a<b){var t=a;a=b;b=t;}
  var st=[];
  while(b>0n){var q=a/b,rem=a%b;st.push(M(fmt(a)+' = '+fmt(b)+' × '+fmt(q)+' + '+fmt(rem)));a=b;b=rem;}
  r.innerHTML='<div class="kv"><div><small>ب.م.م</small><b>'+M(fmt(g))+'</b></div><div><small>ک.م.م</small><b>'+M(fmt(l))+'</b></div></div>'+
    (g===1n?'<p class="sub">عددها نسبت به هم اول‌اند.</p>':'')+
    '<p class="sub">الگوریتم اقلیدس برای دو عدد اول:</p><ol class="steps">'+st.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ol>';
}
function calcPf(){
  var r=$('pf-res'),n=val('pf');
  if(!Number.isInteger(n)||n<2||n>1e12){r.innerHTML=err('یک عدد صحیح بین ۲ تا هزار میلیارد وارد کنید.');return;}
  var m=n,f=[];
  for(var p=2;p*p<=m;p+=(p===2?1:2)){var e=0;while(m%p===0){m/=p;e++;}if(e)f.push([p,e]);}
  if(m>1)f.push([m,1]);
  var cnt=1,sum=1;
  f.forEach(function(x){cnt*=x[1]+1;sum*=(Math.pow(x[0],x[1]+1)-1)/(x[0]-1);});
  var str=f.map(function(x){return fa(String(x[0]))+(x[1]>1?'<sup>'+fa(x[1])+'</sup>':'');}).join(' × ');
  var prime=f.length===1&&f[0][1]===1;
  r.innerHTML='<div class="ans">'+M(fmt(n)+' = '+str)+'</div>'+
    '<div class="kv" style="margin-top:10px"><div><small>اول است؟</small><b>'+(prime?'بله':'خیر')+'</b></div><div><small>تعداد مقسوم‌علیه‌ها</small><b>'+M(fmt(cnt))+'</b></div><div><small>مجموع مقسوم‌علیه‌ها</small><b>'+M(fmt(Math.round(sum)))+'</b></div></div>';
}

function calcLin(){

  if([a,b,c].some(isNaN)){r.innerHTML=err(NEED);return;}
  var eq=M(fmt(a)+'x '+sg(b)+' = '+fmt(c));
  if(a===0){r.innerHTML=ok(b===c?'بی‌شمار جواب دارد':'جواب ندارد',[eq,'چون ضریب x صفر است، فقط برابری '+M(fmt(b)+' = '+fmt(c))+' بررسی می‌شود.']);return;}
  var x=(c-b)/a;
  r.innerHTML=ok(M('x = '+fmtF(x)),[eq,M(fmt(a)+'x = '+fmt(c)+' − '+par(b)+' = '+fmt(c-b)),M('x = '+fmt(c-b)+' ÷ '+par(a)+' = '+fmtF(x))]);
}
function calcQuad(){
  var a=val('qa'),b=val('qb'),c=val('qc'),r=$('quad-res');
  if([a,b,c].some(isNaN)){r.innerHTML=err(NEED);return;}
  if(a===0){r.innerHTML=err('اگر a صفر باشد معادله درجه دوم نیست. از کارت درجه اول استفاده کنید.');return;}
  var d=b*b-4*a*c,tol=1e-12*Math.max(1,b*b,Math.abs(4*a*c));
  var st=[M('Δ = b² − 4ac = '+par(b)+'² − 4 × '+par(a)+' × '+par(c)+' = '+fmt(d))],ans;
  if(d>tol){
    var sq=Math.sqrt(d),x1=(-b+sq)/(2*a),x2=(-b-sq)/(2*a);
    st.push('Δ مثبت است، پس دو ریشهٔ حقیقی داریم.');
    st.push(M('x = (−b ± √Δ) ÷ 2a = ('+fmt(-b)+' ± '+fmt(sq)+') ÷ '+fmt(2*a)));
    ans=M('x₁ = '+fmtF(x1))+'<br>'+M('x₂ = '+fmtF(x2));
  }else if(Math.abs(d)<=tol){
    var x0=-b/(2*a);st.push('Δ صفر است، پس یک ریشهٔ مضاعف داریم.');st.push(M('x = −b ÷ 2a = '+fmt(-b)+' ÷ '+fmt(2*a)));
    ans=M('x = '+fmtF(x0));
  }else{
    var re=-b/(2*a),im=Math.sqrt(-d)/(2*Math.abs(a));
    st.push('Δ منفی است، پس ریشه‌ها مختلط‌اند.');
    ans=M('x = '+fmt(re)+' ± '+fmt(im)+'i');
  }
  var xv=-b/(2*a),yv=c-b*b/(4*a);
  st.push('رأس سهمی: '+M('( '+fmtF(xv)+' , '+fmtF(yv)+' )'));
  st.push('مجموع ریشه‌ها '+M(fmtF(-b/a))+' و حاصل‌ضرب ریشه‌ها '+M(fmtF(c/a)));
  r.innerHTML=ok(ans,st);
}
function calcSys(){
  var a1=val('s1a'),b1=val('s1b'),c1=val('s1c'),a2=val('s2a'),b2=val('s2b'),c2=val('s2c'),r=$('sys-res');
  if([a1,b1,c1,a2,b2,c2].some(isNaN)){r.innerHTML=err(NEED);return;}
  var D=a1*b2-a2*b1,Dx=c1*b2-c2*b1,Dy=a1*c2-a2*c1;
  var st=[M('D = '+par(a1)+' × '+par(b2)+' − '+par(a2)+' × '+par(b1)+' = '+fmt(D)),M('Dx = '+par(c1)+' × '+par(b2)+' − '+par(c2)+' × '+par(b1)+' = '+fmt(Dx)),M('Dy = '+par(a1)+' × '+par(c2)+' − '+par(a2)+' × '+par(c1)+' = '+fmt(Dy))];
  if(Math.abs(D)<1e-12){
    var inf=Math.abs(Dx)<1e-12&&Math.abs(Dy)<1e-12;
    st.push('D صفر است، پس دستگاه جواب یکتا ندارد.');
    r.innerHTML=ok(inf?'بی‌شمار جواب دارد':'جواب ندارد',st);return;
  }
  var x=Dx/D,y=Dy/D;
  st.push(M('x = Dx ÷ D = '+fmtF(x)));st.push(M('y = Dy ÷ D = '+fmtF(y)));
  r.innerHTML=ok(M('x = '+fmtF(x))+'<br>'+M('y = '+fmtF(y)),st);
}

  }
}

var EX={0:['0','1'],30:['1/2','√3/2'],45:['√2/2','√2/2'],60:['√3/2','1/2'],90:['1','0']};
function exact(deg){
  if(!Number.isInteger(deg))return null;
  var d=((deg%360)+360)%360,ref=d<=90?d:(d<=180?180-d:(d<=270?d-180:360-d));
  if(!EX.hasOwnProperty(ref))return null;
  var sn=d>180?'−':'',cs=(d>90&&d<270)?'−':'';
  var sv=EX[ref][0],cv=EX[ref][1];
  return {s:(sv==='0'?'0':sn+sv),c:(cv==='0'?'0':cs+cv)};
}
function drawCircle(rad){

  g+='<line x1="'+f(px)+'" y1="'+cy+'" x2="'+f(px)+'" y2="'+f(py)+'" stroke="var(--c-arith)" stroke-width="4" stroke-linecap="round"/>';

function calcTrig(){
  var x=val('ta'),u=$('tu').value,r=$('trig-res');
  if(isNaN(x)){r.innerHTML=err('زاویه را درست وارد کنید.');return;}
  var rad=u==='d'?x*PI/180:x,deg=u==='d'?x:x*180/PI;
  var s=Math.sin(rad),c=Math.cos(rad),z=function(v){return Math.abs(v)<1e-12?0:v;};
  s=z(s);c=z(c);
  var inv=function(v){return v===0?NaN:1/v;};
  var t=c===0?NaN:s/c,cot=s===0?NaN:c/s;

  var fr=toFrac(deg/180),radTxt;

  else if(fr)radTxt=(Math.abs(fr.p)===1?(fr.p<0?'−':''):fmt(fr.p))+'π/'+fmt(fr.q);
  else radTxt=fmt(deg*PI/180);
  var ex=exact(deg),exTxt='';

  r.innerHTML='<div class="kv">'+tile('sin',s)+tile('cos',c)+tile('tan',t)+tile('cot',cot)+tile('sec',inv(c))+tile('csc',inv(s))+'</div>'+exTxt+
    '<p class="sub">این زاویه برابر است با '+M(fmt(deg)+'°')+' یا '+M(radTxt+' rad')+'.</p>';

function calcInv(){
  var f=$('ivf').value,v=val('ivv'),r=$('iv-res');
  if(isNaN(v)){r.innerHTML=err('مقدار را درست وارد کنید.');return;}
  if(f!=='tan'&&Math.abs(v)>1){r.innerHTML=err('مقدار sin و cos باید بین ۱- و ۱ باشد.');return;}
  var t0=(f==='sin'?Math.asin(v):(f==='cos'?Math.acos(v):Math.atan(v)))*180/PI;
  var cand=f==='sin'?[t0,180-t0]:(f==='cos'?[t0,360-t0]:[t0,t0+180]);
  var out=[];
  cand.forEach(function(a){a=((a%360)+360)%360;if(!out.some(function(o){return Math.abs(o-a)<1e-9||Math.abs(Math.abs(o-a)-360)<1e-9;}))out.push(a);});
  out.sort(function(a,b){return a-b;});
  r.innerHTML='<div class="ans">'+M(f+' θ = '+fmt(v))+'</div><div class="tags">'+out.map(function(a){return '<span>'+fmt(a)+'°</span>';}).join('')+'</div>'+
    '<p class="sub">زاویهٔ اصلی '+M(fmt(t0)+'°')+' است. جواب‌های دیگر با افزودن مضرب‌های ۳۶۰ درجه به‌دست می‌آیند.</p>';
}

function calcStat(){

  var n=a.length,sum=a.reduce(function(p,q){return p+q;},0),mean=sum/n;

/* ---------- حسابان ---------- */
function parsePoly(src){
  var s=norm(src).replace(/\s+/g,'').replace(/X/g,'x');
  if(!s)throw new Error('تابع را بنویسید.');
  if(/[()]/.test(s))throw new Error('پرانتز پشتیبانی نمی‌شود. عبارت را بازنویسی کنید.');
  if(/\^-/.test(s))throw new Error('توان منفی پشتیبانی نمی‌شود.');
  var co=[],parts=s.split(/(?=[+-])/);
  parts.forEach(function(t){
    if(t==='')return;
    var m=/^([+-]?)(\d*\.?\d*)(\*?x(?:\^(\d+))?)?$/.exec(t);
    if(!m||(m[2]===''&&!m[3])||m[2]==='.')throw new Error('«'+t+'» قابل فهم نیست. از قالبی مثل 3x^2 - 5x + 2 استفاده کنید.');
    var c=m[2]===''?1:parseFloat(m[2]);if(m[1]==='-')c=-c;
    var k=m[3]?(m[4]!==undefined?parseInt(m[4],10):1):0;
    if(k>20)throw new Error('بیشترین توان مجاز ۲۰ است.');
    while(co.length<=k)co.push(0);co[k]+=c;
  });
  return co;
}
function polyHTML(co,tail){
  var out='';
  for(var k=co.length-1;k>=0;k--){
    var c=co[k];if(Math.abs(c)<1e-12)continue;
    var neg=c<0,ac=Math.abs(c),f=toFrac(ac),cs;
    if(k>0&&Math.abs(ac-1)<1e-12)cs='';else cs=f?fmt(f.p)+'/'+fmt(f.q):fmt(ac);
    var xs=k>0?'x'+(k>1?'<sup>'+fa(k)+'</sup>':''):'';
    out+=(out?(neg?' − ':' + '):(neg?'−':''))+cs+xs;
  }
  if(!out)out='۰';
  return out+(tail||'');
}
var ep=function(c,x){var r=0;for(var k=c.length-1;k>=0;k--)r=r*x+c[k];return r;};
function niceStep(r){var e=Math.pow(10,Math.floor(Math.log10(r))),f=r/e;return (f<1.5?1:f<3.5?2:f<7.5?5:10)*e;}
function plot(co,dco,a,b){
  var W=600,H=300,pl=40,pr=12,pt=12,pb=24,X0=-5,X1=5,N=240,i;
  var xs=[],fy=[],dy=[],all=[0];
  for(i=0;i<=N;i++){var x=X0+(X1-X0)*i/N;xs.push(x);var u=ep(co,x),w=ep(dco,x);fy.push(u);dy.push(w);if(Math.abs(u)<1e6)all.push(u);if(Math.abs(w)<1e6)all.push(w);}
  var lo=Math.max(-30,Math.min.apply(null,all)),hi=Math.min(30,Math.max.apply(null,all));
  if(hi-lo<1){lo=-1;hi=1;}
  var pad=(hi-lo)*0.08;lo-=pad;hi+=pad;
  var sx=function(x){return pl+(W-pl-pr)*(x-X0)/(X1-X0);},sy=function(y){return pt+(H-pt-pb)*(1-(y-lo)/(hi-lo));};
  var f1=function(n){return n.toFixed(1);},g='';
  for(i=X0;i<=X1;i++){g+='<line class="gl" x1="'+f1(sx(i))+'" y1="'+pt+'" x2="'+f1(sx(i))+'" y2="'+(H-pb)+'"/><text class="tx" x="'+f1(sx(i))+'" y="'+(H-8)+'" text-anchor="middle">'+fa(String(i)).replace('-','−')+'</text>';}
  var st=niceStep((hi-lo)/5);
  for(var yv=Math.ceil(lo/st)*st;yv<=hi;yv+=st){var yy=Math.abs(yv)<st/1000?0:yv;g+='<line class="gl" x1="'+pl+'" y1="'+f1(sy(yy))+'" x2="'+(W-pr)+'" y2="'+f1(sy(yy))+'"/><text class="tx" x="'+(pl-5)+'" y="'+f1(sy(yy)+4)+'" text-anchor="end">'+fmtS(yy)+'</text>';}
  g+='<line class="ax" x1="'+f1(sx(0))+'" y1="'+pt+'" x2="'+f1(sx(0))+'" y2="'+(H-pb)+'"/><line class="ax" x1="'+pl+'" y1="'+f1(sy(0))+'" x2="'+(W-pr)+'" y2="'+f1(sy(0))+'"/>';
  var A=Math.max(Math.min(a,b),X0),B=Math.min(Math.max(a,b),X1);

  }
  var path=function(ys,col,wd,dash){var d='',pen=false;ys.forEach(function(v,k){if(!isFinite(v)){pen=false;return;}d+=(pen?'L':'M')+f1(sx(xs[k]))+' '+f1(sy(v))+' ';pen=true;});return '<path d="'+d+'" fill="none" stroke="var('+col+')" stroke-width="'+wd+'" stroke-linejoin="round"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';};
  g+=path(dy,'--c-trig',2.2,'7 5')+path(fy,'--c-calc',3);

  $('cplot').innerHTML=g;
}
function calcCalc(){

/* ---------- ترکیبیات ---------- */
function bigFmt(v){
  var s=v.toString();
  if(s.length<=22)return fmt(v);
  return fa(s[0])+'٫'+fa(s.slice(1,6))+' × ۱۰<sup>'+fa(s.length-1)+'</sup> ('+fa(s.length)+' رقمی)';
}
function bfact(n){var r=1n;for(var i=2n;i<=BigInt(n);i++)r*=i;return r;}
function ncr(n,r){r=Math.min(r,n-r);var res=1n;for(var i=1;i<=r;i++)res=res*BigInt(n-r+i)/BigInt(i);return res;}
function npr(n,r){var res=1n;for(var i=0;i<r;i++)res*=BigInt(n-i);return res;}
function calcComb(){
  var n=val('cn'),r0=val('cr'),el=$('comb-res');

    '<div style="grid-column:1/-1"><small>جایگشت '+M('P(n,r) = n! ÷ (n−r)!')+'</small><b>'+M(bigFmt(npr(n,r0)))+'</b></div>'+
    '<div style="grid-column:1/-1"><small>ترکیب '+M('C(n,r) = n! ÷ (r!(n−r)!)')+'</small><b>'+M(bigFmt(ncr(n,r0)))+'</b></div></div>';

  var s=SEC.filter(function(x){return x.id===id;})[0],h=$('phead');

  h.innerHTML='<span class="big" aria-hidden="true">'+s.g+'</span><div><h2>'+s.t+'</h2><p>'+s.s+'</p></div>';
}
function init(){
  var tabs=$('tabs');
  tabs.innerHTML=SEC.map(function(s){return '<button type="button" role="tab" class="tab t-'+s.id+'" id="tab-'+s.id+'" aria-controls="p-'+s.id+'" aria-selected="false"><span class="g" aria-hidden="true">'+s.g+'</span>'+s.n+'</button>';}).join('');
  SEC.forEach(function(s){$('tab-'+s.id).addEventListener('click',function(){show(s.id);});});
  tabs.addEventListener('keydown',function(e){
    var k=e.key;if(k!=='ArrowLeft'&&k!=='ArrowRight')return;
    var idx=SEC.map(function(s){return s.id;}).indexOf((R.activeElement?R.activeElement.id:'').replace('tab-',''));
    if(idx<0)return;
    idx=(idx+(k==='ArrowLeft'?1:-1)+SEC.length)%SEC.length;
    show(SEC[idx].id);$('tab-'+SEC[idx].id).focus();e.preventDefault();
  });

  $('keys').innerHTML=KEYS.map(function(k){return '<button type="button" class="'+(k[2]||'')+'" data-k="'+k[1]+'" aria-label="'+k[0]+'">'+k[0]+'</button>';}).join('');
  $('keys').addEventListener('click',function(e){var b=e.target.closest('button');if(b)ins(b.getAttribute('data-k'));});
  $('ex').addEventListener('keydown',function(e){if(e.key==='Enter')calcEx();});
  bind(['ex','angle'],calcEx);
  bind(['pm','pa','pb'],calcPct);
  bind(['gl'],calcGcd);
  bind(['pf'],calcPf);
  bind(['la','lb','lc'],calcLin);
  bind(['qa','qb','qc'],calcQuad);
  bind(['s1a','s1b','s1c','s2a','s2b','s2c'],calcSys);

  var gs=$('gs');gs.innerHTML=Object.keys(SH).map(function(k){return '<option value="'+k+'">'+SH[k].n+'</option>';}).join('');
  gs.addEventListener('change',buildShape);$('gf').addEventListener('input',calcShape);buildShape();
  bind(['pym','pya','pyb'],calcPy);

  $('tchips').innerHTML=[0,30,45,60,90,120,180,270,360].map(function(d){return '<button type="button" data-d="'+d+'">'+fa(d)+'°</button>';}).join('');
  $('tchips').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;$('tu').value='d';$('ta').value=b.getAttribute('data-d');calcTrig();});
  bind(['ta','tu'],calcTrig);
  bind(['ivf','ivv'],calcInv);
  bind(['sl'],calcStat);
  bind(['cf','cx0','ca','cb'],calcCalc);
  bind(['cn','cr'],calcComb);
  bind(['fn'],calcFib);
  bind(['bv','bb'],calcBase);

  show('arith');
}
init();
};

</script>

<script>
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','fa');

/* ---------- کمکی‌های نوشتن ریاضی ---------- */
const m=s=>`<span class="m">${s}</span>`;
const F=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const S=x=>`<span class="sq">√<span class="ov">${x}</span></span>`;
const R=(pre,f,post='')=>`<div class="rl" dir="rtl"><span>${pre}</span><span class="m">${f}</span>${post?`<span>${post}</span>`:''}</div>`;
const B=(...ls)=>`<div class="fb m">${ls.map(l=>l.startsWith('<div')?l:`<div>${l}</div>`).join('')}</div>`;
const key=(t,h)=>`<div class="key"><span class="tag">${t}</span>${h}</div>`;
const eg=h=>`<div class="eg"><span class="tag">مثال</span>${h}</div>`;
const tip=h=>`<div class="tip"><span class="tag">نکته</span>${h}</div>`;
const pr=(q,a)=>`<details class="pr"><summary>${q}</summary><div>${a}</div></details>`;
const tb=(head,rows)=>`<div class="tw"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const MX=rows=>`<span class="mx"><span class="mxg" style="grid-template-columns:repeat(${rows[0].length},auto)">${rows.flat().map(v=>`<span>${v}</span>`).join('')}</span></span>`;

function parabolaSvg(){
  const X=x=>30+(x+1)*45, Y=y=>230-(y+2)*27, pts=[];

  let ticks='';
